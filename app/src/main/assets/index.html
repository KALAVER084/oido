<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src https: blob:; connect-src 'self' https:">
<title>Oído</title>
<style>
  :root {
    color-scheme: dark;
    --fondo: hsl(175 22% 7%); --sup: hsl(175 18% 11%); --menu: hsl(175 18% 13%);
    --linea: hsl(175 14% 19%); --texto: hsl(175 20% 92%); --suave: hsl(175 10% 58%);
    --acento: hsl(175 78% 62%); --tinte: hsl(175 45% 18%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    display: flex; flex-direction: column; overscroll-behavior: none;
  }
  .ancho { max-width: 46rem; margin: 0 auto; width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; border-radius: 8px; cursor: pointer; }
  button:focus-visible, li:focus-visible, input:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  input {
    font: inherit; padding: .5rem .75rem; border: 1px solid var(--linea); border-radius: 10px;
    background: transparent; color: var(--texto); min-width: 0;
  }
  input::placeholder { color: var(--suave); }
  input:focus { outline: none; border-color: var(--acento); }
  .primario { padding: .6rem 1rem; border-radius: 10px; background: var(--acento); color: var(--fondo); font-weight: 600; }
  svg { display: block; }

  header { padding: .9rem 1rem 0; }
  #f { display: flex; gap: .5rem; align-items: center; }
  #q { flex: 1; font-size: 1.05rem; padding: .6rem .8rem; }
  #btn-tema { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; color: var(--suave); border-radius: 50%; }
  #btn-tema:hover { color: var(--acento); }

  .respaldo { display: flex; gap: .4rem 1.2rem; flex-wrap: wrap; width: 100%; margin-top: .3rem; }
  #actualizacion {
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    background: var(--tinte); color: var(--texto); border-radius: 12px; padding: .6rem .8rem; margin-bottom: .8rem; font-size: .9rem;
  }
  #actualizacion[hidden] { display: none; }
  #actualizacion span { flex: 1; min-width: 12rem; }
  #actualizacion .descargar { background: var(--acento); color: var(--fondo); font-weight: 600; padding: .4rem .8rem; border-radius: 8px; }
  #actualizacion .cerrar { color: var(--suave); padding: .4rem .5rem; }
  #panel-tema { display: none; margin-top: .8rem; padding: .9rem; background: var(--sup); border-radius: 12px; }
  #panel-tema.abierto { display: block; }
  #tono {
    width: 100%; -webkit-appearance: none; appearance: none; height: 14px; border-radius: 7px; border: 0; padding: 0;
    background: linear-gradient(90deg, hsl(0 80% 60%), hsl(60 80% 60%), hsl(120 80% 60%), hsl(180 80% 60%), hsl(240 80% 60%), hsl(300 80% 60%), hsl(360 80% 60%));
  }
  #tono::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--texto); border: 3px solid var(--fondo); }
  .fila-tema { display: flex; align-items: center; justify-content: space-between; margin-top: .8rem; }
  #puntos { display: flex; gap: .6rem; }
  .punto { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--linea); padding: 0; }
  #btn-buscar { display: grid; place-items: center; width: 3rem; height: 2.75rem; padding: 0; }
  #btn-dinamico { display: flex; align-items: center; gap: .45rem; border: 1px solid var(--linea); border-radius: 999px; padding: .3rem .8rem .3rem .35rem; color: var(--suave); font-size: .9rem; }
  #btn-dinamico.activo { border-color: var(--acento); color: var(--acento); }
  .arcoiris { width: 22px; height: 22px; border-radius: 50%; flex: none;
    background: conic-gradient(hsl(0 75% 60%), hsl(60 75% 60%), hsl(120 75% 60%), hsl(180 75% 60%), hsl(240 75% 60%), hsl(300 75% 60%), hsl(360 75% 60%)); }
  #btn-dinamico.activo .arcoiris { animation: girar 6s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .fila-idioma { display: flex; align-items: center; gap: .5rem; color: var(--suave); font-size: .9rem; }
  #idioma { font: inherit; color: var(--texto); background: var(--fondo); border: 1px solid var(--linea); border-radius: 8px; padding: .3rem .5rem; }
  #btn-compartir-app { display: flex; align-items: center; gap: .45rem; color: var(--acento); padding: .3rem 0; }
  .fila-tema { flex-wrap: wrap; gap: .6rem; }
  #tema-listo { color: var(--acento); padding: .3rem .5rem; }

  nav { display: flex; gap: .25rem; overflow-x: auto; margin-top: .8rem; border-bottom: 1px solid var(--linea); scrollbar-width: none; }
  nav button { padding: .6rem .8rem; white-space: nowrap; color: var(--suave); border-radius: 8px 8px 0 0; border-bottom: 2px solid transparent; }
  nav button[aria-pressed="true"] { color: var(--texto); border-bottom-color: var(--acento); font-weight: 600; }
  nav .cuenta { font-weight: 400; color: var(--suave); font-size: .85rem; margin-left: .3rem; }

  main { flex: 1; overflow-y: auto; padding: 0 1rem 1rem; }
  #estado { color: var(--suave); margin: .75rem 0; min-height: 1.4em; display: flex; gap: .4rem 1rem; align-items: baseline; flex-wrap: wrap; }
  .enlace { color: var(--acento); padding: .2rem 0; }
  .enlace:hover { text-decoration: underline; }
  .chips { display: flex; gap: .4rem; margin: .75rem 0 0; overflow-x: auto; scrollbar-width: none; align-items: center; }
  .chips button { padding: .35rem .9rem; border: 1px solid var(--linea); border-radius: 999px; font-size: .9rem; color: var(--suave); white-space: nowrap; }
  .chips button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
  .chips .orden { display: flex; align-items: center; gap: .35rem; border-color: var(--acento); color: var(--acento); margin-left: auto; }
  form.nueva { display: flex; gap: .5rem; width: 100%; }
  form.nueva input { flex: 1; }
  form.nueva .primario { padding: .45rem .9rem; }
  .vacio { color: var(--suave); }

  ol { list-style: none; margin: 0; padding: 0; }
  li {
    padding: .65rem .35rem; border-bottom: 1px solid var(--linea); border-radius: 6px; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto auto; gap: .1rem .5rem; align-items: center;
  }
  li:hover, li:active { background: color-mix(in srgb, var(--acento) 8%, transparent); }
  li.sonando .titulo { color: var(--acento); font-weight: 600; }
  li.coleccion .titulo { font-weight: 600; }
  li input { font-size: 1rem; padding: .2rem .5rem; }
  .titulo { grid-column: 1; overflow-wrap: anywhere; }
  .canal { grid-column: 1; color: var(--suave); font-size: .85rem; }
  .dur { grid-column: 2; grid-row: 1 / 3; color: var(--suave); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .tipo.vivo { background: var(--acento); color: var(--fondo); letter-spacing: .03em; }
  .tiempo.en-vivo #progreso, .tiempo.en-vivo #t-dur { visibility: hidden; }
  .tiempo.en-vivo #t-pos { color: var(--acento); font-weight: 600; }
  .tipo { font-size: .75rem; font-weight: 600; padding: .15rem .5rem; border-radius: 6px; background: var(--tinte); color: var(--acento); }
  .acciones { grid-column: 3; grid-row: 1 / 3; display: flex; }
  .acciones button { width: 2.3rem; height: 2.5rem; display: grid; place-items: center; color: var(--suave); }
  .acciones button:hover, .acciones button:active { color: var(--acento); background: var(--tinte); }

  #menu {
    position: fixed; display: none; background: var(--menu); border: 1px solid var(--linea);
    border-radius: 12px; padding: .35rem; min-width: 15rem; max-width: calc(100vw - 16px); max-height: 60vh; overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5); z-index: 10;
  }
  #menu.abierto { display: block; }
  #menu p { margin: .2rem .5rem .4rem; color: var(--suave); font-size: .85rem; }
  #menu button { display: block; width: 100%; text-align: left; padding: .65rem .6rem; }
  #menu button:hover { background: var(--tinte); }
  #menu input { width: 100%; margin-top: .3rem; }

  [hidden] { display: none !important; }
  .controles { position: relative; }
  .controles #btn-letra {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 2.8rem; height: 2.8rem; color: var(--suave);
  }
  /* Compartir Oído: a la izquierda, en espejo del botón de letra */
  .controles #btn-compartir-oido { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--suave); }
  .controles #btn-letra.activo { color: var(--acento); }
  .controles #btn-letra.lleno { color: var(--acento); background: var(--tinte); }
  #franja {
    display: flex; flex-direction: column; min-width: 0;
    border-left: 2px solid var(--acento); padding: .2rem .5rem; margin: .1rem 0 .5rem;
  }
  #franja .l1 { color: var(--acento); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #franja .l2 { color: var(--suave); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.2em; }
  body.letra-abierta header, body.letra-abierta main { display: none; }
  #pantalla-letra { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .cab-letra { display: flex; align-items: center; gap: .5rem; padding: 1rem 1rem .4rem; }
  #letra-titulo { flex: 1; min-width: 0; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pista-karaoke { flex: none; color: var(--suave); font-size: .8rem; border: 1px solid var(--linea); border-radius: 999px; padding: .15rem .6rem; }
  .acciones-letra { display: flex; align-items: center; gap: .3rem; flex: none; }
  #btn-sync, #btn-deshacer { width: 2.4rem; height: 2.4rem; display: grid; place-items: center; border-radius: 50%; color: var(--suave); }
  #btn-sync.ajustado { color: var(--acento); background: var(--tinte); }
  #btn-cancelar-sync { border: 1px solid var(--linea); color: var(--suave); border-radius: 999px; padding: .3rem .9rem; font-size: .9rem; }
  .zona-letra { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #letra-cuerpo.sincronizando { padding-top: 45vh; padding-bottom: 45vh; }
  #letra-cuerpo.sincronizando p { color: var(--suave); opacity: .55; }
  #letra-cuerpo.sincronizando p.elegida { color: var(--acento); opacity: 1; font-weight: 700; transform: scale(1.06); }
  #elegida { margin: 0; text-align: center; color: var(--texto); font-weight: 600; font-size: .95rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pie-sync { position: relative; z-index: 2; background: var(--fondo); display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: .5rem 1rem .9rem; }
  .pie-sync:not(:has(> :not([hidden]))) { padding: 0; }
  #pista-sync { margin: 0; text-align: center; color: var(--suave); font-size: .85rem; }
  #pista-sync b { color: var(--acento); }
  #panel-fino { width: 100%; max-width: 30rem; background: var(--sup); border-radius: 14px; padding: .8rem; }
  .tit-fino { margin: 0 0 .6rem; text-align: center; color: var(--suave); font-size: .8rem; }
  .fila-fino { display: flex; align-items: center; justify-content: center; gap: .4rem; }
  .fila-fino button { border: 1px solid var(--linea); border-radius: 999px; padding: .5rem .7rem; font-size: .9rem; white-space: nowrap; }
  .fila-fino button:active { background: var(--tinte); }
  #valor-fino { min-width: 5.2rem; text-align: center; font-weight: 700; font-size: 1.1rem; color: var(--acento); font-variant-numeric: tabular-nums; }
  .lab-fino { display: flex; justify-content: space-between; margin: .35rem .2rem 0; color: var(--suave); font-size: .72rem; }
  .acc-fino { display: flex; justify-content: space-between; align-items: center; margin-top: .7rem; }
  .acc-fino .primario { padding: .4rem 1.3rem; border-radius: 999px; }
  #btn-ahora { font-size: 1.15rem; padding: .7rem 2.6rem; border-radius: 999px; }
  #btn-ahora:active { transform: scale(.96); }
  .canal .ajustada { color: var(--acento); }
  /* La letra vive encerrada en su zona: lo que sobra se recorta y se desplaza por dentro */
  #letra-cuerpo { position: absolute; inset: 0; overflow-y: auto; padding: 30vh 1.25rem; text-align: center; }
  #letra-cuerpo p { margin: .9rem 0; font-size: 1.25rem; line-height: 1.35; color: var(--suave); transition: color .25s, transform .25s; }
  #letra-cuerpo p.actual { color: var(--acento); font-weight: 700; transform: scale(1.04); }
  #letra-cuerpo.fija { padding: 1rem 1.25rem 2rem; text-align: left; }
  #letra-cuerpo .texto-fijo { white-space: pre-wrap; color: var(--texto); font-size: 1.1rem; }
  #letra-cuerpo .aviso-letra { font-size: .9rem; color: var(--suave); }
  #aviso {
    position: fixed; left: 50%; bottom: 9.5rem; transform: translate(-50%, 1rem); opacity: 0; pointer-events: none;
    background: var(--texto); color: var(--fondo); padding: .55rem 1rem; border-radius: 999px; font-size: .9rem; font-weight: 600;
    transition: opacity .2s, transform .2s; z-index: 20; white-space: nowrap;
  }
  #aviso.visible { opacity: 1; transform: translate(-50%, 0); }
  #reproductor { background: var(--sup); border-top: 1px solid var(--linea); padding: .7rem 1rem .8rem; display: none; }
  #reproductor.activo { display: block; }
  #ahora { margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #origen { margin: 0 0 .3rem; font-size: .8rem; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tiempo { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--suave); font-variant-numeric: tabular-nums; }
  #progreso { flex: 1; accent-color: var(--acento); border: 0; padding: 0; }
  .controles { display: flex; justify-content: center; align-items: center; gap: 1.6rem; margin-top: .3rem; }
  .controles button { width: 2.8rem; height: 2.8rem; display: grid; place-items: center; border-radius: 50%; color: var(--texto); }
  @media (hover: hover) {
    .controles button:hover { color: var(--acento); }
    .controles #btn-letra:hover { color: var(--acento); }
    .controles #btn-compartir-oido:hover { color: var(--acento); }
  }
  #play { width: 3.3rem; height: 3.3rem; background: var(--acento); color: var(--fondo); }
  #play:hover { color: var(--fondo); filter: brightness(1.08); }
</style>
</head>
<body>
<header>
  <div class="ancho">
    <div id="actualizacion" hidden>
      <span></span>
      <button type="button" class="descargar" data-t="descargar">Descargar</button>
      <button type="button" class="cerrar" data-t="ahoraNo">Ahora no</button>
    </div>
    <form id="f">
      <input id="q" type="search" data-t-ph="buscarEnYoutube" placeholder="Buscar en YouTube" autocomplete="off" enterkeyhint="search">
      <button class="primario" id="btn-buscar" data-t-aria="buscar" data-t-title="buscar" aria-label="Buscar" title="Buscar"></button>
      <button type="button" id="btn-tema" data-t-title="tema" data-t-aria="cambiarTema" title="Tema" aria-label="Cambiar tema"></button>
    </form>
    <div id="panel-tema">
      <input id="tono" type="range" min="0" max="359" step="1" data-t-aria="tonoTema" aria-label="Tono del tema">
      <div class="fila-tema">
        <div id="puntos"></div>
        <button type="button" id="btn-dinamico" aria-pressed="false" data-t-title="dinamicoTitulo" title="Los colores cambian solos, despacio">
          <span class="arcoiris"></span><span data-t="dinamico">Dinámico</span>
        </button>
      </div>
      <div class="fila-tema">
        <button type="button" id="btn-compartir-app"></button>
        <label class="fila-idioma"><span data-t="idioma">Idioma</span> <select id="idioma"></select></label>
        <button type="button" id="tema-listo" data-t="listo">Listo</button>
      </div>
    </div>
    <nav id="pestanas"></nav>
  </div>
</header>
<main>
  <div class="ancho">
    <div id="estado"></div>
    <ol id="lista"></ol>
  </div>
</main>
<section id="pantalla-letra" hidden>
  <div class="ancho cab-letra">
    <span id="letra-titulo"></span>
    <span id="pista-karaoke" hidden data-t="f11Karaoke" data-t-title="karaokeCompleto">F11 · Karaoke</span>
    <span class="acciones-letra">
      <button id="btn-deshacer" hidden data-t-title="deshacerAjuste" data-t-aria="deshacerAjuste"></button>
      <button id="btn-sync" hidden data-t-aria="sincronizarLetra"></button>
      <button id="btn-cancelar-sync" hidden data-t="cancelar">Cancelar</button>
    </span>
  </div>
  <div class="zona-letra">
    <div id="letra-cuerpo" class="ancho"></div>
  </div>
  <div class="pie-sync">
    <p id="pista-sync" hidden data-t-html="pistaSync"></p>
    <p id="elegida" hidden></p>
    <button id="btn-ahora" class="primario" hidden data-t="ahora">¡Ahora!</button>
    <div id="panel-fino" hidden>
      <p class="tit-fino" data-t="tituloFino"></p>
      <div class="fila-fino">
        <button data-d="-1000" data-t-aria="adelantar1">« 1 s</button>
        <button data-d="-250" data-t-aria="adelantar025">‹ 0,25</button>
        <span id="valor-fino"></span>
        <button data-d="250" data-t-aria="atrasar025">0,25 ›</button>
        <button data-d="1000" data-t-aria="atrasar1">1 s »</button>
      </div>
      <div class="lab-fino"><span data-t="letraTarde"></span><span data-t="letraAdelantada"></span></div>
      <div class="acc-fino">
        <button id="fino-cero" class="enlace" data-t="desdeCero"></button>
        <button id="fino-listo" class="primario" data-t="listo"></button>
      </div>
    </div>
  </div>
</section>
<div id="menu" role="menu"></div>
<div id="aviso" role="status" aria-live="polite"></div>
<section id="reproductor">
  <div class="ancho">
    <p id="ahora"></p>
    <p id="origen"></p>
    <div id="franja" hidden>
      <span class="l1"></span>
      <span class="l2"></span>
    </div>
    <div class="tiempo">
      <span id="t-pos">0:00</span>
      <input id="progreso" type="range" min="0" max="0" value="0" step="1000" data-t-aria="posicion">
      <span id="t-dur"></span>
    </div>
    <div class="controles">
      <button id="ant" data-t-aria="anterior"></button>
      <button id="play" data-t-aria="reproducir"></button>
      <button id="sig" data-t-aria="siguiente"></button>
      <button id="btn-letra" hidden data-t-aria="letra"></button>
      <button id="btn-compartir-oido" data-t-aria="compartirOido" data-t-title="compartirOido"></button>
    </div>
  </div>
</section>
<script>
// ---------- Capas de plataforma ----------
// La misma interfaz sirve para Android y PC; solo cambia quién busca y quién reproduce.
let reproductor;

if (window.OidoNativo) {
  // Android: búsqueda y audio los hace la parte nativa (sigue sonando con la pantalla apagada)
  const pendientes = new Map();
  let nPeticion = 0;
  window.__respuesta = (id, ok, datos) => {
    const p = pendientes.get(id);
    if (!p) return;
    pendientes.delete(id);
    ok ? p.res(datos) : p.rej(new Error(datos));
  };
  const llamar = (metodo, ...args) => new Promise((res, rej) => {
    const id = 'r' + (++nPeticion);
    pendientes.set(id, { res, rej });
    OidoNativo[metodo](id, ...args);
  });
  window.oido = {
    buscar: q => llamar('buscar', q),
    abrirLista: url => llamar('abrirLista', url),
    leerListas: async () => JSON.parse(OidoNativo.leerListas()),
    guardarListas: async l => OidoNativo.guardarListas(JSON.stringify(l)),
    copiar: async t => OidoNativo.copiar(t),
    abrirEnlace: url => OidoNativo.abrirEnlace(url),
    pedir: url => llamar('pedir', url),
    karaoke: json => OidoNativo.karaoke(json),
    compartirTexto: texto => OidoNativo.compartirTexto(texto),
    karaokeLocal: activo => OidoNativo.karaokeLocal(activo),
    guardarArchivo: (texto, nombre) => llamar('guardarArchivo', texto, nombre),
    abrirArchivo: () => llamar('abrirArchivo'),
    compartirArchivo: (texto, nombre) => OidoNativo.compartirArchivo(texto, nombre),
  };
  reproductor = OidoNativo;
  window.alCambiarFondo = color => OidoNativo.colorFondo(color);
} else {
  // PC: el audio suena aquí mismo con un <audio> invisible
  reproductor = (() => {
    // Un <video> invisible: reproduce audio normal y también en vivos (que traen imagen)
    const audio = document.createElement('video');
    audio.style.display = 'none';
    document.body.appendChild(audio);
    let hls = null, vivo = false, promesaHls = null;
    const soltarHls = () => { if (hls) { hls.destroy(); hls = null; } };
    // hls.js solo se carga la primera vez que suena un en vivo
    const cargarHls = () => promesaHls ??= new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'hls.light.min.js';
      sc.onload = () => res(window.Hls);

      },

}

// Idioma elegido a mano, o el del teléfono/PC si está entre los disponibles (si no, inglés)
let idiomaElegido = 'auto';
try { idiomaElegido = localStorage.getItem('oido-idioma') || 'auto'; } catch {}
function idiomaDelSistema() {
  for (const l of (navigator.languages || [navigator.language || 'en'])) {
    const c = String(l).slice(0, 2).toLowerCase();
    if (TEXTOS[c]) return c;
  }
  return 'en';
}
let idioma = idiomaElegido === 'auto' || !TEXTOS[idiomaElegido] ? idiomaDelSistema() : idiomaElegido;

// t('clave', { n: 3 }) → texto en el idioma actual (si falta, en español)
function t(clave, vars) {
  let s = (TEXTOS[idioma] && TEXTOS[idioma][clave]) ?? TEXTOS.es[clave] ?? clave;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.split('{' + k + '}').join(v);
  return s;
}
const nAudios = n => n === 1 ? t('audio1') : t('audiosN', { n });

// Traduce los textos fijos de la pantalla (atributos data-t*)
function traducirPagina() {
  document.documentElement.lang = idioma;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll('[data-t-html]').forEach(e => { e.innerHTML = t(e.dataset.tHtml); });
  document.querySelectorAll('[data-t-ph]').forEach(e => { e.placeholder = t(e.dataset.tPh); });
  document.querySelectorAll('[data-t-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.tAria)); });
  document.querySelectorAll('[data-t-title]').forEach(e => { e.title = t(e.dataset.tTitle); });
}

let mensajeResultados = null; // null = mensaje de bienvenida (se traduce al mostrar)

const cache = new Map();     // id de lista/mix -> {titulo, items}
let listas = [];             // listas propias: [{id, nombre, items}]
let orden = 'relevancia';    // 'relevancia' | 'nuevos' | 'viejos'
const ORDENES = { relevancia: 'relevancia', nuevos: 'masNuevos', viejos: 'masViejos' }; // claves del diccionario

let cola = null;             // {fuente, items, i}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const listaPorId = id => listas.find(l => l.id === id);
const esColeccion = it => it.tipo === 'mix' || it.tipo === 'lista';
const guardar = () => window.oido.guardarListas(listas).catch(() => {});
const soloVideo = it => ({ tipo: 'video', id: it.id, titulo: it.titulo, canal: it.canal, duracion: it.duracion, fecha: it.fecha || null, vivo: !!it.vivo });

// Con fecha: se ordena por fecha (lo que no tiene fecha va al final).
// Sin fechas (algunas listas y mixes): "más viejos" invierte el orden original.
function ordenar(items) {
  if (orden === 'relevancia') return items;
  if (!items.some(x => x.fecha)) return orden === 'viejos' ? [...items].reverse() : items;
  const con = items.filter(x => x.fecha), sin = items.filter(x => !x.fecha);
  con.sort((a, b) => orden === 'nuevos' ? b.fecha - a.fecha : a.fecha - b.fecha);
  return [...con, ...sin];
}

let relativo = new Intl.RelativeTimeFormat(idioma, { numeric: 'auto' }); // "hace 2 días" en el idioma actual
function haceCuanto(seg) {
  const d = (seg * 1000 - Date.now()) / 1000;
  const pasos = [[60, 'second'], [60, 'minute'], [24, 'hour'], [30, 'day'], [12, 'month'], [Infinity, 'year']];
  let v = d;
  for (const [n, u] of pasos) {
    if (Math.abs(v) < n) return relativo.format(Math.round(v), u);
    v /= n;
  }
}

function itemsDeVista() {
  if (vista === 'resultados') {
    const r = ordenar(resultados);
    if (filtro === 'audios') return r.filter(x => !esColeccion(x));
    if (filtro === 'listas') return r.filter(esColeccion);
    return r;
  }
  if (vista === 'abierta') return ordenar(abierta?.items || []);
  return listaPorId(vista)?.items || [];
}

async function videosDe(coleccion) {
  if (cache.has(coleccion.id)) return cache.get(coleccion.id);
  const r = await window.oido.abrirLista(coleccion.id);
  cache.set(coleccion.id, r);
  return r;
}

// ---------- Pestañas ----------
function pintarPestanas() {
  const nav = $('#pestanas');
  nav.innerHTML = '';
  const tab = (id, nombre, cuenta, activa) => {
    const b = document.createElement('button');
    b.setAttribute('aria-pressed', activa ?? vista === id);
    b.textContent = nombre.length > 28 ? nombre.slice(0, 27) + '…' : nombre;
    b.title = nombre;
    if (cuenta != null) {
      const c = document.createElement('span');
      c.className = 'cuenta'; c.textContent = cuenta;
      b.appendChild(c);
    }
    b.onclick = () => { vista = id; pintar(); };
    nav.appendChild(b);
  };
  tab('resultados', t('resultados'));
  if (abierta) tab('abierta', abierta.titulo || t('cargandoPuntos'), abierta.cargando ? null : abierta.items.length);
  tab('mislistas', t('misListas'), listas.length, vista === 'mislistas' || !!listaPorId(vista));
}

function crearLista(nombre, items = []) {
  nombre = (nombre || '').trim();
  if (!nombre) return null;
  const l = { id: uid(), nombre: nombre.slice(0, 40), items: items.map(soloVideo) };
  listas.push(l);
  guardar();
  return l;
}

// ---------- Contenido ----------
function enlace(txt, fn) {
  const b = document.createElement('button');
  b.className = 'enlace'; b.textContent = txt; b.onclick = fn;
  return b;
}
function texto(t) { const s = document.createElement('span'); s.textContent = t; return s; }

function pintarEstado() {
  estadoEl.innerHTML = '';
  if (vista === 'resultados') {
    estadoEl.appendChild(texto(mensajeResultados ?? t('buscaAlgo')));
    if (!resultados.length && window.oido.abrirExtensiones) estadoEl.appendChild(enlace(t('carpetaExt'), () => window.oido.abrirExtensiones()));
  } else if (vista === 'abierta') {
    if (abierta.cargando) estadoEl.appendChild(texto(t('cargandoAudios')));
    else if (abierta.error) estadoEl.appendChild(texto(t('noAbrirLista')));
    else {
      estadoEl.appendChild(texto(nAudios(abierta.items.length)));
      if (abierta.items.length) {
        estadoEl.appendChild(enlace(t('reproducirTodo'), () => tocar('abierta', itemsDeVista()[0])));
        estadoEl.appendChild(enlace(t('guardarEnMisListas'), () => {
          const l = crearLista(abierta.titulo || t('listaGuardada'), abierta.items);
          if (l) { vista = l.id; pintar(); }
        }));
      }
    }
    estadoEl.appendChild(enlace(t('cerrar'), () => { abierta = null; vista = 'resultados'; pintar(); }));
  } else if (vista === 'mislistas') {
    const f = document.createElement('form');
    f.className = 'nueva';
    f.innerHTML = '<input maxlength="40"><button class="primario"></button>';
    f.querySelector('input').placeholder = t('nombreNuevaLista');
    f.querySelector('button').textContent = t('crearLista');
    f.onsubmit = e => { e.preventDefault(); if (crearLista(f.querySelector('input').value)) pintar(); };
    estadoEl.appendChild(f);
    const r = document.createElement('div');
    r.className = 'respaldo';
    if (listas.length) {
      r.appendChild(enlace(t('guardarCopia'), guardarCopia));
      if (window.oido.compartirArchivo) r.appendChild(enlace(t('enviar'), enviarCopia));
    }
    r.appendChild(enlace(t('importar'), importarDesdeArchivo));
    estadoEl.appendChild(r);
  } else {
    const l = listaPorId(vista);
    estadoEl.appendChild(enlace(t('volverMisListas'), () => { vista = 'mislistas'; pintar(); }));
    estadoEl.appendChild(texto(l.items.length ? t('enLaLista', { n: l.items.length }) : t('listaVacia')));
    if (l.items.length) estadoEl.appendChild(enlace(t('reproducirTodo'), () => tocar(vista, l.items[0])));
    estadoEl.appendChild(enlace(t('borrarLista'), () => borrarLista(l.id)));
  }

  // Filtros de resultados
  const viejo = $('.chips');
  if (viejo) viejo.remove();
  const conOrden = (vista === 'resultados' && resultados.length) || (vista === 'abierta' && abierta && abierta.items.length);
  if (conOrden) {
    const chips = document.createElement('div');
    chips.className = 'chips';
    const bo = document.createElement('button');
    bo.className = 'orden';
    bo.innerHTML = icono('orden', 16) + '<span></span>';
    bo.querySelector('span').textContent = t(ORDENES[orden]);
    bo.title = t('cambiarOrden');
    bo.onclick = () => { orden = orden === 'relevancia' ? 'nuevos' : orden === 'nuevos' ? 'viejos' : 'relevancia'; pintar(); };
    if (vista === 'resultados') {
      [['todo', t('todo')], ['audios', t('audiosChip')], ['listas', t('listasYMixes')]].forEach(([id, nombre]) => {
        const b = document.createElement('button');
        b.textContent = nombre;
        b.setAttribute('aria-pressed', filtro === id);
        b.onclick = () => { filtro = id; pintar(); };
        chips.appendChild(b);
      });
    }
    chips.appendChild(bo);
    estadoEl.before(chips);
  }
}

function pintarMisListas() {
  listaEl.innerHTML = '';
  if (!listas.length) {
    const p = document.createElement('p');
    p.className = 'vacio';
    p.textContent = t('sinListas');
    listaEl.appendChild(p);
    return;
  }
  listas.forEach(l => {
    const li = document.createElement('li');
    li.tabIndex = 0;
    li.innerHTML = '<span class="titulo"></span><span class="canal"></span><span class="dur"></span><span class="acciones"></span>';
    li.querySelector('.titulo').textContent = l.nombre;
    li.querySelector('.canal').textContent = nAudios(l.items.length);
    if (cola && cola.fuente === l.id) { li.classList.add('sonando'); li.querySelector('.dur').textContent = t('sonando'); }
    const acc = li.querySelector('.acciones');
    const accion = (txt, titulo, fn) => {
      const b = document.createElement('button');
      b.innerHTML = icono(txt); b.title = titulo; b.setAttribute('aria-label', titulo);
      b.onclick = e => { e.stopPropagation(); fn(); };
      acc.appendChild(b);
    };
    if (l.items.length) accion('play', t('reproducir'), () => tocar(l.id, l.items[0]));
    accion('edit', t('renombrar'), () => renombrar(li, l));
    accion('x', t('borrarLista'), () => borrarLista(l.id));
    const abrirL = () => { vista = l.id; pintar(); };
    li.onclick = abrirL;
    li.onkeydown = e => { if (e.key === 'Enter') abrirL(); };
    listaEl.appendChild(li);
  });
}

function renombrar(li, l) {
  const t = li.querySelector('.titulo');
  const inp = document.createElement('input');
  inp.value = l.nombre; inp.maxLength = 40;
  t.replaceWith(inp);
  inp.onclick = e => e.stopPropagation();
  let hecho = false;
  const fin = ok => {
    if (hecho) return; hecho = true;
    if (ok && inp.value.trim()) { l.nombre = inp.value.trim(); guardar(); }
    pintar();
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); };
  inp.onblur = () => fin(true);
  inp.focus(); inp.select();
}

function pintar() {
  pintarPestanas();
  pintarEstado();
  if (vista === 'mislistas') return pintarMisListas();
  const items = itemsDeVista();
  const propia = !!listaPorId(vista);
  listaEl.innerHTML = '';

  items.forEach((it, i) => {
    const li = document.createElement('li');
    li.tabIndex = 0;
    li.innerHTML = '<span class="titulo"></span><span class="canal"></span><span class="dur"></span><span class="acciones"></span>';
    li.querySelector('.titulo').textContent = it.titulo;
    li.querySelector('.canal').textContent = [it.canal, it.fecha ? haceCuanto(it.fecha) : ''].filter(Boolean).join(' · ');
    if (!esColeccion(it) && ajustes[it.id] != null) {
      const m = document.createElement('span');
      m.className = 'ajustada';
      m.textContent = ' · ' + t('letraAjustada');
      li.querySelector('.canal').appendChild(m);
    }
    if (esColeccion(it)) {
      li.classList.add('coleccion');
      const etq = document.createElement('span');
      etq.className = 'tipo'; etq.textContent = it.tipo === 'mix' ? t('mix') : t('lista');
      li.querySelector('.dur').appendChild(etq);
    } else if (it.vivo) {
      const etq = document.createElement('span');
      etq.className = 'tipo vivo'; etq.textContent = t('enVivo');
      li.querySelector('.dur').appendChild(etq);
    } else {
      li.querySelector('.dur').textContent = it.duracion || '';
    }
    if (cola && cola.fuente === vista && cola.items[cola.i] === it) li.classList.add('sonando');

    const acc = li.querySelector('.acciones');
    const accion = (txt, titulo, fn) => {
      const b = document.createElement('button');
      b.innerHTML = icono(txt); b.title = titulo; b.setAttribute('aria-label', titulo);
      b.onclick = e => { e.stopPropagation(); fn(b); };
      acc.appendChild(b);
    };
    accion('enlace', t('copiarEnlace'), () => copiarEnlace(it));
    accion('plus', esColeccion(it) ? t('anadirTodosALista') : t('anadirALista'), b => abrirMenu(b, it));
    if (propia) {
      if (i > 0) accion('up', t('subir'), () => mover(i, i - 1));
      if (i < items.length - 1) accion('down', t('bajar'), () => mover(i, i + 1));
      accion('x', t('quitarDeLista'), () => quitar(i));
    }

    const activar = () => esColeccion(it) ? abrir(it) : tocar(vista, it);
    li.onclick = activar;
    li.onkeydown = e => { if (e.key === 'Enter') activar(); };
    listaEl.appendChild(li);
  });
}

// Abre un mix o lista de YouTube y empieza a sonar
async function abrir(col) {
  abierta = { id: col.id, titulo: col.titulo, items: [], cargando: true };
  vista = 'abierta';
  pintar();
  const yo = abierta;
  try {
    const r = await videosDe(col);
    if (yo !== abierta) return;
    abierta.items = r.items;
    abierta.cargando = false;
    pintar();
    if (r.items.length) tocar('abierta', r.items[0]);
  } catch {
    if (yo !== abierta) return;
    abierta.cargando = false; abierta.error = true;
    pintar();
  }
}

function mover(de, a) {
  const items = listaPorId(vista).items;
  [items[de], items[a]] = [items[a], items[de]];
  if (cola && cola.items === items) {
    reproductor.mover(de, a);
    if (cola.i === de) cola.i = a; else if (cola.i === a) cola.i = de;
  }
  guardar(); pintar();
}

function quitar(i) {
  const items = listaPorId(vista).items;
  items.splice(i, 1);
  if (cola && cola.items === items) {
    reproductor.quitar(i);
    if (i <= cola.i) cola.i--;
  }
  guardar(); pintar();
}

function borrarLista(id) {
  const l = listaPorId(id);
  if (!confirm(t('confirmarBorrar', { nombre: l.nombre }))) return;
  listas = listas.filter(x => x.id !== id);
  if (cola && cola.fuente === id) cola.fuente = 'borrada';
  vista = 'mislistas';
  guardar(); pintar();
}

// ---------- Menú "añadir a lista" ----------
async function anadir(lista, item) {
  const nuevos = esColeccion(item) ? (await videosDe(item)).items : [item];
  const agregados = [];
  for (const v of nuevos) if (!lista.items.some(x => x.id === v.id)) { lista.items.push(soloVideo(v)); agregados.push(soloVideo(v)); }
  if (cola && cola.items === lista.items && agregados.length) reproductor.agregar(JSON.stringify(agregados));
  guardar(); pintar();
}

// ---------- Reproducción (la hace Android, incluso con la pantalla apagada) ----------
const fmt = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
};

function tocar(fuente, item) {
  // Resultados se copian (una búsqueda nueva no corta lo que suena) y sin mixes/listas.
  // Las listas propias se usan en vivo: lo que añadas entra en la cola.
  let items;
  if (fuente === 'resultados') items = ordenar(resultados).filter(r => !esColeccion(r));
  else if (fuente === 'abierta') items = ordenar(abierta.items);
  else items = listaPorId(fuente).items;
  const titulo = fuente === 'abierta' ? abierta.titulo : null;
  cola = { fuente, items, i: Math.max(0, items.indexOf(item)), titulo };
  reproductor.reproducir(JSON.stringify(items.map(soloVideo)), cola.i, String(fuente), titulo || '');
  $('#reproductor').classList.add('activo');
  $('#ahora').textContent = t('cargandoDos') + item.titulo;
  pintar();
}

function nombreOrigen() {

// ---------- Copiar enlace (para mandarlo por WhatsApp, etc.) ----------
function enlaceDe(it) {
  if (/^https?:/.test(it.id)) return it.id;                       // Android: listas y mixes ya traen su dirección
  if (it.tipo === 'mix' && /^RD[\w-]{11}$/.test(it.id))
    return `https://www.youtube.com/watch?v=${it.id.slice(2)}&list=${it.id}`;
  if (it.tipo === 'mix' || it.tipo === 'lista') return `https://www.youtube.com/playlist?list=${it.id}`;
  return `https://youtu.be/${it.id}`;
}
let temporizadorAviso;
function avisar(texto) {
  const a = $('#aviso');
  a.textContent = texto;
  a.classList.add('visible');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => a.classList.remove('visible'), 1800);
}
async function copiarEnlace(it) {
  const url = enlaceDe(it);
  try {
    if (window.oido.copiar) await window.oido.copiar(url);
    else await navigator.clipboard.writeText(url);
    avisar(t('enlaceCopiado'));
  } catch {
    avisar(t('noCopiarEnlace'));
  }
}

}, null, 1);

// Combina: agrega listas nuevas y, si ya existe una con el mismo nombre, suma los audios que falten.
function importarListas(texto) {
  let datos;
  try { datos = JSON.parse(texto); } catch { return avisar(t('noRespaldo')); }
  const entrantes = Array.isArray(datos) ? datos : datos && datos.listas;
  if (!Array.isArray(entrantes)) return avisar(t('noRespaldo'));
  let nuevas = 0, audios = 0;
  for (const e of entrantes) {
    if (!e || typeof e.nombre !== 'string' || !Array.isArray(e.items)) continue;
    const items = e.items.filter(x => x && typeof x.id === 'string' && x.id).map(soloVideo);
    let l = listas.find(x => x.nombre.trim().toLowerCase() === e.nombre.trim().toLowerCase());
    if (!l) { l = { id: uid(), nombre: e.nombre.trim().slice(0, 40) || t('lista'), items: [] }; listas.push(l); nuevas++; }
    for (const it of items) if (!l.items.some(x => x.id === it.id)) {
      l.items.push(it); audios++;
      if (cola && cola.items === l.items) reproductor.agregar(JSON.stringify([it]));
    }
  }
  // Ajustes de letra: se agregan los que no tengas (los tuyos no se tocan)
  if (datos && datos.ajustes && typeof datos.ajustes === 'object') {
    for (const [id, ms] of Object.entries(datos.ajustes)) {
      if (ajustes[id] == null && Number.isFinite(ms)) ajustes[id] = ms;
    }
    guardarAjustes();
  }
  guardar();
  vista = 'mislistas';
  pintar();
  avisar(nuevas || audios
    ? t('importado', { l: nuevas === 1 ? t('lista1') : t('listasN', { n: nuevas }), a: nAudios(audios) })
    : t('nadaNuevo'));
}
window.__importar = importarListas; // Android: "Abrir con Oído" desde WhatsApp o el correo

// ---------- Letra (LRCLIB): sincronizada si la versión coincide, si no, fija ----------
const cacheLetra = new Map();
let letra = null;             // { id, estado: 'cargando' | 'sin' | 'sinc' | 'fija', lineas, texto }
// Un solo botón cicla: 'mini' (franja) → 'completa' → 'cerrada' → 'mini'… (se recuerda)
let modoLetra = 'mini';
try { modoLetra = localStorage.getItem('oido-letra-modo') || 'mini'; } catch {}
let pantallaLetra = false;    // ¿se está mostrando la pantalla completa ahora?
let posActual = 0;            // ms, la última posición que avisó el reproductor
let posMarca = 0;             // cuándo llegó ese aviso (para calcular la posición exacta en un toque)
let posSonando = false;
const posAhora = () => posActual + (posSonando ? Date.now() - posMarca : 0);
let sincronizando = false;    // modo "sync": deslizar la letra hasta la línea que suena
let ajustandoFino = false;    // panel de ajuste fino (± 0,25 s / ± 1 s)

// Ajuste de tiempo por video: { idDelVideo: milisegundos }. Se recuerda para siempre.
let ajustes = {};
try { ajustes = JSON.parse(localStorage.getItem('oido-ajustes') || '{}') || {}; } catch {}
const guardarAjustes = () => { try { localStorage.setItem('oido-ajustes', JSON.stringify(ajustes)); } catch {} };

// Aplica el ajuste guardado (si lo hay) a la letra tal como vino de LRCLIB
function conAjuste(id, r) {
  const off = ajustes[id];
  if (off == null || !r.lineas) return { id, ...r, ajustada: false };
  return { id, ...r, estado: 'sinc', ajustada: true, lineas: r.lineas.map(l => ({ t: l.t + off, texto: l.texto })) };
}
const lineasBase = () => ((letra && cacheLetra.get(letra.id)) || letra || {}).lineas || [];
let lineaActual = -1;
let tituloLetra = '';

const sinAcentos = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const segundos = d => (d || '').split(':').reduce((a, x) => a * 60 + (+x || 0), 0);

// "Artista - Canción (Video Oficial) [4K]" -> { artista, cancion }
function limpiarTitulo(it) {
  let t = (it.titulo || '')
    .replace(/[(\[{][^)\]}]*[)\]}]/g, ' ')               // (Official Video), [Lyrics], (En vivo)…
    .split(/\s[|｜]\s/)[0]                                // "Canción | Álbum" -> "Canción"
    .replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, ' ') // emojis
    .replace(/\s(ft\.?|feat\.?|featuring)\s.*$/i, ' ')   // "ft. Alguien"
    .replace(/\s+/g, ' ').trim();
  let artista = (it.canal || '').replace(/\s*-\s*Topic$/i, '').replace(/VEVO$/i, '').replace(/\s+Official$/i, '').trim();
  let cancion = t;
  const partes = t.split(/\s[-–—]\s/);
  if (partes.length >= 2) { artista = partes[0].trim(); cancion = partes.slice(1).join(' - ').trim(); }
  cancion = cancion.replace(/["“”]/g, '').replace(/\s+(lyrics?|letra|con letra)$/i, '').trim();
  return { artista, cancion };
}

function leerLRC(txt) {
  const lineas = [];
  for (const l of txt.split('\n')) {
    const tiempos = [...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if (!tiempos.length) continue;
    const texto = l.replace(/\[[^\]]*\]/g, '').trim() || '♪';
    for (const t of tiempos) lineas.push({ t: (+t[1] * 60 + +t[2]) * 1000, texto });
  }
  return lineas.sort((a, b) => a.t - b.t);
}

async function pedirJSON(url) {
  const txt = await window.oido.pedir(url);
  return txt ? JSON.parse(txt) : null;
}

async function buscarLetra(it) {
  const { artista, cancion } = limpiarTitulo(it);
  const dur = segundos(it.duracion);
  if (!cancion) return { estado: 'sin' };
  const base = 'https://lrclib.net/api/';
  let cands = [];
  if (artista && dur) {   // 1) búsqueda exacta: artista + canción + duración
    const g = await pedirJSON(base + 'get?' + new URLSearchParams({ artist_name: artista, track_name: cancion, duration: dur })).catch(() => null);
    if (g && g.id) cands.push(g);
  }
  if (!cands.length) {    // 2) búsqueda libre, comprobando que el nombre de la canción se parezca
    const r = await pedirJSON(base + 'search?' + new URLSearchParams({ q: (artista + ' ' + cancion).trim() })).catch(() => null);
    const c = sinAcentos(cancion);
    if (Array.isArray(r)) cands = r.filter(x => {
      const n = sinAcentos(x.trackName);
      return n && c && (n.includes(c.slice(0, 12)) || c.includes(n.slice(0, 12)));
    });
  }
  cands = cands.filter(c => !c.instrumental && (c.syncedLyrics || c.plainLyrics));
  if (!cands.length) return { estado: 'sin' };
  const dif = c => dur ? Math.abs((c.duration || 0) - dur) : 999;
  // Sincronizada solo si la duración coincide (±3 s): si no, es otra versión y se desfasaría
  const sinc = cands.filter(c => c.syncedLyrics && dif(c) <= 3).sort((a, b) => dif(a) - dif(b))[0];
  if (sinc) return { estado: 'sinc', lineas: leerLRC(sinc.syncedLyrics) };
  const c = [...cands].sort((a, b) => dif(a) - dif(b))[0];
  // Si hay tiempos de otra versión se guardan: con "sync" se pueden ajustar a este video
  const conTiempos = cands.filter(x => x.syncedLyrics).sort((a, b) => dif(a) - dif(b))[0];
  return {
    estado: 'fija',
    texto: c.plainLyrics || c.syncedLyrics.replace(/\[[^\]]*\]/g, '').trim(),
    lineas: conTiempos ? leerLRC(conTiempos.syncedLyrics) : null,
  };
}

function actualizarLetra(s) {
  posActual = s.pos;
  posMarca = Date.now();
  posSonando = !!s.sonando;
  const it = cola && s.hay ? cola.items[s.index] : null;
  const id = it && !it.vivo ? it.id : null;
  if (id !== (letra ? letra.id : null)) {
    lineaActual = -1;
    sincronizando = false;
    ajustandoFino = false;
    tituloLetra = it ? it.titulo : '';
    if (!id) letra = null;
    else if (cacheLetra.has(id)) letra = conAjuste(id, cacheLetra.get(id));
    else {
      letra = { id, estado: 'cargando' };
      buscarLetra(it).then(r => {
        cacheLetra.set(id, r);
        if (letra && letra.id === id) { letra = conAjuste(id, r); pintarLetra(); }
      }).catch(() => {
        if (letra && letra.id === id) { letra = { id, estado: 'sin' }; pintarLetra(); }
      });
    }
    pintarLetra();
  }
  if (letra && letra.estado === 'sinc') moverLetra(s.pos);
  if (hayKaraoke()) enviarKaraoke({ tipo: 'pos', pos: s.pos, dur: s.dur });
}

function pintarLetra() {
  const est = letra ? letra.estado : 'sin';
  const conLetra = est === 'sinc' || est === 'fija';
  const mini = modoLetra === 'mini' && est === 'sinc';
  pantallaLetra = modoLetra === 'completa' && (conLetra || est === 'cargando');
  const b = $('#btn-letra');
  b.hidden = !(conLetra || pantallaLetra);
  b.classList.toggle('activo', mini);
  b.classList.toggle('lleno', pantallaLetra);
  b.title = pantallaLetra ? t('cerrarLetra') : mini ? t('letraCompleta')
    : est === 'fija' ? t('verLetraFija') : t('mostrarLetra');
  $('#franja').hidden = !mini;
  document.body.classList.toggle('letra-abierta', pantallaLetra);
  $('#pantalla-letra').hidden = !pantallaLetra;
  if (pantallaLetra) pintarPantallaLetra();
  if (est === 'sinc') { const l = lineaActual; lineaActual = -2; moverLetra(null, l); }
  avisarLetraCompleta();
  actualizarKaraokeLocal();
  karaokeCancion();
}

function cambiarModoLetra(modo) {
  modoLetra = modo;
  try { localStorage.setItem('oido-letra-modo', modo); } catch {}
  pintarLetra();
}

function pintarAccionesLetra() {
  const conTiempos = !!(letra && letra.lineas && letra.lineas.length);
  $('#btn-sync').hidden = !conTiempos || sincronizando || ajustandoFino;
  $('#btn-sync').classList.toggle('ajustado', !!(letra && letra.ajustada));
  $('#btn-sync').title = letra && letra.ajustada ? t('volverASincronizar') : t('sincronizarLetra');
  $('#btn-deshacer').hidden = !(letra && letra.ajustada) || sincronizando || ajustandoFino;
  $('#panel-fino').hidden = !ajustandoFino;
  if (ajustandoFino) pintarValorFino();
  $('#btn-cancelar-sync').hidden = !sincronizando;
  $('#pista-sync').hidden = !sincronizando;
  $('#elegida').hidden = !sincronizando;
  $('#btn-ahora').hidden = !sincronizando;
}

function pintarPantallaLetra() {
  $('#letra-titulo').textContent = tituloLetra;
  pintarAccionesLetra();
  const cuerpo = $('#letra-cuerpo');
  cuerpo.innerHTML = '';
  cuerpo.classList.toggle('sincronizando', sincronizando);
  if (sincronizando && letra && letra.lineas) return pintarModoSync(cuerpo);
  cuerpo.classList.toggle('fija', !!letra && letra.estado === 'fija');
  if (!letra || letra.estado === 'sin') { cuerpo.innerHTML = '<p class="aviso-letra"></p>'; cuerpo.firstChild.textContent = t('sinLetra'); return; }
  if (letra.estado === 'cargando') { cuerpo.innerHTML = '<p class="aviso-letra"></p>'; cuerpo.firstChild.textContent = t('buscandoLetra'); return; }
  if (letra.estado === 'fija') {
    const nota = document.createElement('p');
    nota.className = 'aviso-letra';
    nota.textContent = letra.lineas
      ? t('fijaConTiempos')
      : t('fijaSinTiempos');
    const p = document.createElement('p');
    p.className = 'texto-fijo';
    p.textContent = letra.texto;
    cuerpo.append(nota, p);
    cuerpo.scrollTop = 0;
    return;
  }
  letra.lineas.forEach((l, i) => {
    const p = document.createElement('p');
    p.textContent = l.texto;
    p.dataset.i = i;
    cuerpo.appendChild(p);
  });
  cuerpo.scrollTop = 0; // canción nueva: empezar desde arriba, no donde quedó la anterior
}

// Resalta la línea que suena (pos en ms). Se adelanta 0,2 s para que no se sienta tarde.
function moverLetra(pos, forzar) {
  const ls = letra.lineas;
  let i = forzar;
  if (pos != null) {
    i = -1;
    for (let k = 0; k < ls.length && ls[k].t <= pos + 200; k++) i = k;
  }
  if (i === lineaActual) return;
  lineaActual = i;
  $('#franja .l1').textContent = i >= 0 ? ls[i].texto : '♪';
  $('#franja .l2').textContent = ls[i + 1] ? ls[i + 1].texto : '';
  if (pantallaLetra && !sincronizando) {
    const cuerpo = $('#letra-cuerpo');
    cuerpo.querySelectorAll('p.actual').forEach(p => p.classList.remove('actual'));
    const p = cuerpo.querySelector(`p[data-i="${i}"]`);
    if (p) { p.classList.add('actual'); p.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    else cuerpo.scrollTo({ top: 0, behavior: 'smooth' }); // intro: todavía no se canta nada
  }
}

function cerrarPantallaLetra() { sincronizando = false; ajustandoFino = false; cambiarModoLetra('cerrada'); }

// ---------- Ajuste fino: mover toda la letra unos milisegundos, con la canción sonando ----------
const segundosFino = ms => (ms >= 0 ? '+' : '−') + (Math.abs(ms) / 1000).toFixed(2).replace('.', ',') + ' s';
function pintarValorFino() {
  $('#valor-fino').textContent = segundosFino(letra ? (ajustes[letra.id] || 0) : 0);
}
function moverFino(delta) {
  if (!letra || !letra.lineas) return;
  ajustes[letra.id] = (ajustes[letra.id] || 0) + delta;
  guardarAjustes();
  letra = conAjuste(letra.id, cacheLetra.get(letra.id) || letra);
  // Mismas líneas, otros tiempos: basta con volver a ubicar la actual (sin redibujar)
  lineaActual = -2;
  moverLetra(posAhora());
  pintarValorFino();
  pintar(); // la marca "letra ajustada" en la lista
  karaokeCancion(); // el karaoke (tele o teléfono girado) también usa los tiempos nuevos
}
document.querySelectorAll('#panel-fino [data-d]').forEach(b => { b.onclick = () => moverFino(+b.dataset.d); });
$('#fino-listo').onclick = () => { ajustandoFino = false; pintarAccionesLetra(); };
$('#fino-cero').onclick = () => { ajustandoFino = false; sincronizando = true; pintarLetra(); };

// ---------- Sincronizar a mano: poner en la guía la línea que viene y tocar "¡Ahora!" ----------
const REACCION_MS = 150;   // lo que tardamos en reaccionar al oír la línea

function pintarModoSync(cuerpo) {
  cuerpo.classList.remove('fija');
  lineasBase().forEach((l, i) => {
    const p = document.createElement('p');
    p.textContent = l.texto;
    p.dataset.i = i;
    cuerpo.appendChild(p);
  });
  // Empieza en la línea que vendría a continuación, para deslizar poco
  let i = 0;
  (letra.lineas || []).forEach((l, k) => { if (l.t <= posAhora()) i = k + 1; });
  const p = cuerpo.querySelector(`p[data-i="${Math.min(i, lineasBase().length - 1)}"]`);
  if (p) p.scrollIntoView({ block: 'center' });
  resaltarElegida();
}

// Mientras deslizas, se pinta la línea que quedó en el centro: esa es la que vas a marcar
let resaltadoPendiente = false;
function resaltarElegida() {
  if (!sincronizando) return;
  const i = lineaEnLaGuia();
  const cuerpo = $('#letra-cuerpo');
  cuerpo.querySelectorAll('p.elegida').forEach(p => p.classList.remove('elegida'));
  const p = cuerpo.querySelector(`p[data-i="${i}"]`);
  if (p) p.classList.add('elegida');
  const l = lineasBase()[i];
  $('#elegida').textContent = l ? t('marcaras', { t: l.texto }) : '';
}
$('#letra-cuerpo').addEventListener('scroll', () => {
  if (!sincronizando || resaltadoPendiente) return;
  resaltadoPendiente = true;
  requestAnimationFrame(() => { resaltadoPendiente = false; resaltarElegida(); });
}, { passive: true });

function lineaEnLaGuia() {
  const cuerpo = $('#letra-cuerpo');
  const r = cuerpo.getBoundingClientRect();
  const centro = r.top + r.height / 2;
  let mejor = null, dist = Infinity;
  cuerpo.querySelectorAll('p[data-i]').forEach(p => {
    const b = p.getBoundingClientRect();
    const d = Math.abs(b.top + b.height / 2 - centro);
    if (d < dist) { dist = d; mejor = p; }
  });
  return mejor ? +mejor.dataset.i : -1;
}

// Se toca justo cuando empieza a cantarse la línea de la guía
function marcarAhora() {
  if (!sincronizando || !letra) return;
  const momento = posAhora() - REACCION_MS;
  const linea = lineasBase()[lineaEnLaGuia()];
  if (!linea) return;
  ajustes[letra.id] = Math.round(momento - linea.t);
  guardarAjustes();
  sincronizando = false;
  letra = conAjuste(letra.id, cacheLetra.get(letra.id) || letra);
  lineaActual = -1;
  pintarLetra();
  pintar();
  avisar(t('letraSincronizada'));
}

$('#btn-sync').innerHTML = icono('sync', 20);
$('#btn-sync').onclick = () => {
  if (letra && letra.estado === 'sinc') { ajustandoFino = true; pintarAccionesLetra(); }
  else { sincronizando = true; pintarLetra(); }
};
$('#btn-deshacer').innerHTML = icono('deshacer', 20);
$('#btn-deshacer').onclick = () => {
  if (!letra) return;
  delete ajustes[letra.id];
  guardarAjustes();
  letra = conAjuste(letra.id, cacheLetra.get(letra.id) || letra);
  lineaActual = -1;
  pintarLetra();
  pintar();
  avisar(t('ajusteEliminado'));
};
$('#btn-cancelar-sync').onclick = () => { sincronizando = false; pintarLetra(); };
$('#btn-ahora').onclick = marcarAhora;

// Un solo botón: sincronizada mini → completa → cerrada; fija (sin franja): completa ↔ cerrada
$('#btn-letra').innerHTML = icono('letra', 24);
$('#btn-letra').onclick = () => {
  if (!letra) return;
  const siguiente = letra.estado === 'sinc'
    ? { mini: 'completa', completa: 'cerrada', cerrada: 'mini' }[pantallaLetra ? 'completa' : modoLetra] || 'mini'
    : pantallaLetra ? 'cerrada' : 'completa';
  cambiarModoLetra(siguiente);
};

// ---------- Karaoke: en la tele (segunda pantalla) o con el teléfono en horizontal ----------
const esAndroid = !!window.OidoNativo;
const horizontal = window.matchMedia ? matchMedia('(orientation: landscape)') : { matches: false, addEventListener() {} };
let pantallaExterna = false;
let letraCompletaAvisada = false;

function datosKaraoke() {
  const it = cola && cola.items[cola.i];
  const l = letra && (letra.estado === 'sinc' || letra.estado === 'fija') ? letra : null;
  return {
    tipo: 'cancion',
    titulo: it ? it.titulo : '',
    canal: it ? it.canal : '',
    letra: l ? { estado: l.estado, lineas: l.lineas, texto: l.texto } : null,
    tema: colores(tonoActual),
    textos: { fija: t('karaokeFija') },
  };
}
// El karaoke (en la tele o encima de la app) lo muestra Android con su propia pantalla
let karaokeLocalActivo = false;
const hayKaraoke = () => !!window.oido.karaoke && (pantallaExterna || karaokeLocalActivo);
function enviarKaraoke(m) {
  if (hayKaraoke()) window.oido.karaoke(JSON.stringify(m));
}
function karaokeCancion() {
  if (hayKaraoke()) enviarKaraoke(datosKaraoke());
}
// Teléfono en horizontal + letra a pantalla completa = modo karaoke (solo Android)
function actualizarKaraokeLocal() {
  // Con una tele conectada el karaoke va en la tele: el teléfono sigue siendo el control
  const activo = esAndroid && pantallaLetra && horizontal.matches && !pantallaExterna;
  if (activo === karaokeLocalActivo) return;
  karaokeLocalActivo = activo;
  document.body.classList.toggle('karaoke', activo);
  window.oido.karaokeLocal(activo);   // al estar lista avisa con __karaokeListo y se le manda la canción
}
window.__karaokeListo = () => enviarKaraoke(datosKaraoke());

// PC: F11 abre o cierra el karaoke (segundo monitor si hay; si no, la misma pantalla)
if (!esAndroid && window.oido.alKaraoke) {
  document.addEventListener('keydown', e => {
    if (e.key !== 'F11') return;
    e.preventDefault();
    window.oido.karaokeLocal(!karaokeLocalActivo);
  });
  window.oido.alKaraoke('karaoke-abierto', () => { karaokeLocalActivo = true; enviarKaraoke(datosKaraoke()); });
  window.oido.alKaraoke('karaoke-cerrado', () => { karaokeLocalActivo = false; });
  $('#pista-karaoke').hidden = false;
}
// Con la letra completa abierta el teléfono puede girar y la pantalla no se apaga
function avisarLetraCompleta() {
  if (!esAndroid || letraCompletaAvisada === pantallaLetra) return;
  letraCompletaAvisada = pantallaLetra;
  OidoNativo.letraCompleta(pantallaLetra);
}
horizontal.addEventListener('change', actualizarKaraokeLocal);
window.__pantallaExterna = conectada => {
  pantallaExterna = conectada;
  actualizarKaraokeLocal();
  if (conectada) enviarKaraoke(datosKaraoke());
};

// ---------- Tema: eliges un tono y se calculan fondo, texto y acento ----------
const TONOS = [175, 35, 350, 265, 130, 210];
function colores(h) {
  const ajuste = (h >= 40 && h <= 80) ? -6 : (h >= 210 && h <= 280) ? 6 : 0; // amarillos brillan más, azules menos
  return {
    '--fondo': `hsl(${h} 22% 7%)`, '--sup': `hsl(${h} 18% 11%)`, '--menu': `hsl(${h} 18% 13%)`,
    '--linea': `hsl(${h} 14% 19%)`, '--texto': `hsl(${h} 20% 92%)`, '--suave': `hsl(${h} 10% 58%)`,
    '--acento': `hsl(${h} 78% ${62 + ajuste}%)`, '--tinte': `hsl(${h} 45% 18%)`,
  };
}
function hslAHex(h, s, l) {
  s /= 100; l /= 100;
  const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}
let tonoActual = 175;
function aplicarTema(h) {
  h = Math.round(+h) % 360;
  tonoActual = h;
  for (const [k, v] of Object.entries(colores(h))) document.documentElement.style.setProperty(k, v);
  try { localStorage.setItem('oido-tono', h); } catch {}
  if (window.alCambiarFondo) window.alCambiarFondo(hslAHex(h, 22, 7));
  if (typeof enviarKaraoke === 'function') enviarKaraoke({ tipo: 'tema', tema: colores(h) });
}
function prepararTema() {
  let h = 175;
  try { h = +(localStorage.getItem('oido-tono') ?? 175); } catch {}
  const panel = $('#panel-tema'), barra = $('#tono');
  barra.value = h;
  aplicarTema(h);
  $('#btn-tema').innerHTML = icono('tema', 22);
  $('#btn-tema').onclick = () => panel.classList.toggle('abierto');
  barra.addEventListener('input', () => { activarDinamico(false); aplicarTema(barra.value); });
  const puntos = $('#puntos');
  TONOS.forEach(tn => {
    const b = document.createElement('button');
    b.className = 'punto';
    b.style.background = `hsl(${tn} 75% 60%)`;
    b.dataset.tono = tn;
    b.setAttribute('aria-label', t('tono', { n: tn }));
    b.onclick = () => { activarDinamico(false); barra.value = tn; aplicarTema(tn); };
    puntos.appendChild(b);
  });
  $('#tema-listo').onclick = () => panel.classList.remove('abierto');

  // Dinámico: el tono avanza 1 grado cada 2 segundos (una vuelta completa en ~12 minutos)
  let reloj = null;
  function activarDinamico(on) {
    clearInterval(reloj);
    $('#btn-dinamico').classList.toggle('activo', on);
    $('#btn-dinamico').setAttribute('aria-pressed', on);
    try { localStorage.setItem('oido-dinamico', on ? '1' : '0'); } catch {}
    if (on) reloj = setInterval(() => {
      const nuevo = (tonoActual + 1) % 360;
      barra.value = nuevo;
      aplicarTema(nuevo);
    }, 2000);
  }
  $('#btn-dinamico').onclick = () => activarDinamico(!$('#btn-dinamico').classList.contains('activo'));
  try { if (localStorage.getItem('oido-dinamico') === '1') activarDinamico(true); } catch {}

  // Compartir Oído: el enlace a la última versión
  $('#btn-compartir-app').innerHTML = icono('compartirOido', 18) + '<span data-t="compartirOido"></span>';
  $('#btn-compartir-oido').innerHTML = icono('compartirOido', 24);
  $('#btn-compartir-app').onclick = $('#btn-compartir-oido').onclick = async () => {
    const enlace = 'https://github.com/KALAVER084/oido/releases/latest';
    const texto = t('mensajeCompartir', { enlace });
    if (window.oido.compartirTexto) return window.oido.compartirTexto(texto);
    try { await (window.oido.copiar ? window.oido.copiar(texto) : navigator.clipboard.writeText(texto)); avisar(t('enlaceOidoCopiado')); }
    catch { avisar(t('noCopiar')); }
  };
}
prepararTema();
