<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Oído · Karaoke</title>
<!--
  Modo karaoke. La misma página se muestra:
  - en la tele, cuando hay una segunda pantalla (cable, dock, Miracast);
  - en el teléfono, al girarlo con la letra en pantalla completa.
  Recibe mensajes { tipo: 'cancion' | 'pos', ... } de la app.
-->
<style>
  :root {
    color-scheme: dark;
    --fondo: hsl(175 22% 7%); --linea: hsl(175 14% 19%); --texto: hsl(175 20% 92%);
    --suave: hsl(175 10% 58%); --acento: hsl(175 78% 62%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fondo); color: var(--texto); overflow: hidden;
    font: 16px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  }
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  /* En vivo: etiqueta en lugar de la barra de tiempo */
  .en-vivo { display: inline-flex; align-items: center; gap: .5em; font-size: 2.4vmin; letter-spacing: .12em; font-weight: 600; color: var(--acento, #fff); }
  .en-vivo::before { content: ''; width: .7em; height: .7em; border-radius: 50%; background: currentColor; animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .35; } }
  body.vivo .bar { display: none; }
  /* Salir: aparece al tocar la pantalla */
  #salir { position: fixed; top: 3vmin; right: 3vmin; z-index: 5; width: 9vmin; height: 9vmin; min-width: 44px; min-height: 44px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.45); color: #fff; font-size: 5vmin; line-height: 1; cursor: pointer;
    transition: opacity .3s; }
  #salir.oculto { opacity: 0; pointer-events: none; }
  #rollo .l { text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
  #k { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 4vh 5vw 5vh; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4vw; }
  #tit { font-size: 3.4vmin; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }
  #art { font-size: 2.6vmin; color: var(--suave); }
  .logo { display: flex; align-items: center; gap: 1vmin; color: var(--suave); font-size: 2.6vmin; flex: none; }
  .logo svg { width: 3.6vmin; height: 3.6vmin; }

  .vista { flex: 1; min-height: 0; display: none; }
  .vista.visible { display: flex; }

  /* Letra sincronizada: un rollo que sube suavemente; la línea actual queda al centro, grande */
  #lineas { position: relative; overflow: hidden; }
  #rollo { position: absolute; left: 0; right: 0; top: 0; text-align: center; will-change: transform;
           transition: transform .55s cubic-bezier(.22, .7, .25, 1); }
  #rollo.sin-animacion { transition: none; }
  #rollo .l { max-width: 70vw; margin: 0 auto; padding: 2.2vh 0; font-size: 5.2vmin; line-height: 1.25;
              color: var(--texto); opacity: .45; transform-origin: center;
              transition: opacity .4s ease, color .4s ease, transform .4s ease; }
  #rollo .l.pasada { opacity: .22; }
  #rollo .l.actual { color: var(--acento); opacity: 1; font-weight: 700; transform: scale(1.32); }

  /* Letra fija: texto completo que se desplaza con el avance de la canción */
  #fija { overflow: hidden; justify-content: center; }
  #fija-texto { white-space: pre-wrap; text-align: center; font-size: 4.6vmin; line-height: 1.5; padding: 20vh 0; }
  #fija-nota { position: absolute; top: 12vh; left: 0; right: 0; text-align: center; color: var(--suave); font-size: 2.4vmin; }

  /* Sin letra: título y logo en grande */
  #solo { flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 2vh; }
  #solo svg { width: 18vmin; height: 18vmin; }
  #solo-tit { font-size: 6vmin; font-weight: 700; max-width: 90vw; }
  #solo-art { font-size: 3.6vmin; color: var(--suave); }

  .bar { display: flex; align-items: center; gap: 2vw; font-size: 2.4vmin; color: var(--suave); font-variant-numeric: tabular-nums; }
  .trk { flex: 1; height: .7vmin; min-height: 3px; border-radius: 99px; background: var(--linea); overflow: hidden; }
  #prog { height: 100%; width: 0; background: var(--acento); transition: width .25s linear; }
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>
<button id="salir" type="button" aria-label="Salir" hidden>×</button>
<div id="k">
  <div class="top">
    <div><div id="tit"></div><div id="art"></div></div>
    <div class="logo">
      <svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="42" cy="54" r="7.5" fill="currentColor" style="color:var(--acento)"/><g fill="none" stroke="var(--acento)" stroke-width="7" stroke-linecap="round"><path d="M54.4 41a18 18 0 0 1 0 26"/><path d="M64.2 31a32 32 0 0 1 0 46"/></g></svg>
      Oído
    </div>
  </div>

  <div id="lineas" class="vista"><div id="rollo"></div></div>

  <div id="fija" class="vista">
    <div id="fija-nota">Letra sin sincronizar</div>
    <div id="fija-texto"></div>
  </div>

  <div id="solo" class="vista visible">
    <svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="42" cy="54" r="7.5" fill="var(--acento)"/><g fill="none" stroke="var(--acento)" stroke-width="7" stroke-linecap="round"><path d="M54.4 41a18 18 0 0 1 0 26"/><path d="M64.2 31a32 32 0 0 1 0 46"/></g></svg>
    <div id="solo-tit">Oído</div>
    <div id="solo-art"></div>
  </div>

  <div class="bar"><span id="pos">0:00</span><div class="trk"><div id="prog"></div></div><span id="dur"></span></div>
  <div class="en-vivo" id="vivo" hidden>EN VIVO</div>
</div>
<script>
const $ = s => document.querySelector(s);
let cancion = null, pos = 0, dur = 0, actual = -2;

const fmt = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
};

function mostrar(id) {
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('visible', v.id === id));
}

function aplicarColores(tema) {
  if (tema) for (const [k, v] of Object.entries(tema)) document.documentElement.style.setProperty(k, v);
}

function pintar() {
  const c = cancion || {};
  aplicarColores(c.tema);
  $('#tit').textContent = c.titulo || '';
  $('#fija-nota').textContent = (c.textos && c.textos.fija) || 'Letra sin sincronizar';
  $('#vivo').textContent = (c.textos && c.textos.vivo) || 'EN VIVO';
  $('#vivo').hidden = !c.vivo;
  document.body.classList.toggle('vivo', !!c.vivo);
  $('#salir').setAttribute('aria-label', (c.textos && c.textos.salir) || 'Salir');
  $('#art').textContent = c.canal || '';
  $('#solo-tit').textContent = c.titulo || 'Oído';
  $('#solo-art').textContent = c.canal || '';
  const est = c.letra && c.letra.estado;
  if (est === 'sinc') { mostrar('lineas'); construirRollo(c.letra.lineas || []); }
  else if (est === 'fija') { mostrar('fija'); $('#fija-texto').textContent = c.letra.texto || ''; $('#fija').scrollTop = 0; }
  else mostrar('solo');
  // Cuando hay letra, el título va arriba; sin letra, va grande en el centro
  document.querySelector('.top').style.visibility = est ? 'visible' : 'hidden';
  actual = -2;
  mover();
}

function mover() {
  $('#pos').textContent = fmt(pos);
  $('#dur').textContent = dur ? fmt(dur) : '';
  $('#prog').style.width = dur ? Math.min(100, pos / dur * 100) + '%' : '0';
  const l = cancion && cancion.letra;
  if (!l) return;
  if (l.estado === 'fija') {
    const f = $('#fija');
    if (dur) f.scrollTo({ top: (f.scrollHeight - f.clientHeight) * Math.min(1, pos / dur), behavior: 'smooth' });
    return;
  }
  const ls = l.lineas || [];
  let i = -1;
  for (let k = 0; k < ls.length && ls[k].t <= pos + 200; k++) i = k; // 0,2 s de adelanto
  if (i === actual) return;
  const primera = actual === -2;
  actual = i;
  const els = $('#rollo').children;
  for (let k = 0; k < els.length; k++) {
    els[k].classList.toggle('actual', k === i);
    els[k].classList.toggle('pasada', k < i);
  }
  centrar(!primera);
  if (!primera && i >= 0) Fondo.destello();        // verso nuevo: la animación reacciona
}

// Arma todas las líneas una debajo de otra
function construirRollo(ls) {
  const r = $('#rollo');
  r.innerHTML = '';
  for (const l of ls) {
    const d = document.createElement('div');
    d.className = 'l';
    d.textContent = l.texto || '♪';
    r.appendChild(d);
  }
}

// Desliza el rollo para que la línea actual (o la primera, en la intro) quede al centro
function centrar(animado) {
  const r = $('#rollo');
  const ref = r.children[Math.max(0, actual)];
  if (!ref) return;
  const alto = $('#lineas').clientHeight;
  const y = alto / 2 - (ref.offsetTop + ref.offsetHeight / 2);
  r.classList.toggle('sin-animacion', !animado);
  r.style.transform = `translateY(${y}px)`;
  if (!animado) requestAnimationFrame(() => r.classList.remove('sin-animacion'));
}
window.addEventListener('resize', () => centrar(false));

function recibir(m) {
  if (!m || typeof m !== 'object') return;
  if (m.tipo === 'cancion') { cancion = m; pintar(); Fondo.cancion(m); }
  // Solo cambió el color (tema dinámico o elegido): se repinta sin reiniciar la letra
  else if (m.tipo === 'tema') { aplicarColores(m.tema); Fondo.colores(m.tema); if (cancion) cancion.tema = m.tema; }
  else if (m.tipo === 'pos') { pos = m.pos || 0; dur = m.dur || 0; mover(); }
}
// ---------- Fondo animado: 23 animaciones de líneas que reaccionan a los versos ----------
// Se mueven solas; con letra sincronizada, cada verso nuevo dispara la reacción de la animación (Fondo.destello()).
const Fondo = (() => {
  const cv = $('#fondo'), x = cv.getContext('2d');
  let W = 0, H = 0, u = 1, HUE = 175, FON = '#0e1615', ef = -1, clave = null, t = 0, ultimo = 0, Z = {};
  const c = (h, s, l, a = 1) => `hsla(${((h % 360) + 360) % 360} ${s}% ${l}% / ${a})`;

  // ===== Ritmo propio + versos =====
  // Las líneas respiran solas, suave y continuo. Con letra sincronizada, cada verso nuevo
  // manda una ola y un latido (y cada animación hace su propia reacción: gota, ráfaga, eco…).
  const Bs = new Float32Array(16);
  const G = { golpe: 0, cuerpo: 0, voz: 0, brillo: 0 };
  let vol = .35, nivel = .35, olas = [], golpe = false, patada = 0, caja = 0, verso = false;
  function sonido(dt) {
    G.golpe = .26 + .1 * Math.sin(t * .5);
    G.cuerpo = .24 + .08 * Math.sin(t * .31 + 1);
    G.voz = .3 + .1 * Math.sin(t * .37 + 2);
    G.brillo = .2 + .06 * Math.sin(t * .43 + 3);
    nivel = .38 + .06 * Math.sin(t * .2);
    golpe = verso; verso = false;
    if (golpe) { olas.push(0); patada = 1; }
    patada = Math.max(0, patada - dt * 2.5);           // el latido del verso se apaga en ~0,4 s
    for (let k = 0; k < 16; k++) Bs[k] = k <= 2 ? Math.min(1, G.golpe + patada * .6) : k <= 5 ? G.cuerpo : k <= 11 ? G.voz : G.brillo;
    vol = Math.min(1, nivel + patada * .25);
    olas = olas.map(o => o + dt * .9).filter(o => o < 1.6);
  }
  const banda = q => { const d = Math.abs(q - .5) * 2; return Math.min(1.3, (G.golpe * .45 + patada * .85) * (1 - d) + G.voz * Math.exp(-Math.pow((d - .35) * 3, 2)) * .7 + (G.brillo * .25 + caja * .45) * d + nivel * .12); };
  const ola = fr => { let s = 0; for (const o of olas) s += Math.exp(-Math.pow((fr - (1 - o)) * 7, 2)); return s * 1.5; };   // ola del bombo, exagerada
  const ruido = (q, i) => Math.sin(q * 23 + i * 1.7 + t * .9) * .35 + Math.sin(q * 51 - i * .9 + t * 1.4) * .2 + Math.sin(q * 9 + i * .4 - t * .5) * .45;
  const centro = (q, a = 3.2) => Math.exp(-Math.pow((q - .5) * a, 2));
  const trazo = (w, col) => { x.strokeStyle = col; x.lineWidth = Math.max(1, w); x.stroke(); };
  const tapar = () => { x.fillStyle = FON; x.fill(); };
  // Impulso del verso para las animaciones que no usan olas (sube al instante y baja en ~1,2 s)
  const impulso = dt => { if (golpe) Z.p = 1; Z.p = Math.max(0, (Z.p || 0) - dt * .8); return Z.p * Z.p * (3 - 2 * Z.p); };
  // Líneas apiladas que se tapan unas a otras (las de adelante tapan a las de atrás)
  function apiladas(N, top, alto, altura, estilo) {
    const esp = alto / N;
    for (let i = 0; i < N; i++) {
      const y0 = top + i * esp, fr = i / N, pts = [];
      x.beginPath(); x.moveTo(0, y0);
      for (let px = 0; px <= W; px += 4 * u) { const y = y0 - altura(px / W, i, fr, esp); x.lineTo(px, y); pts.push([px, y]); }
      x.lineTo(W, y0 + H); x.lineTo(0, y0 + H); x.closePath();
      estilo(i, fr, y0, pts, esp);
    }
  }
  const alturaBase = (q, i, fr, esp, k = 3.2) => Math.max(0, ruido(q, i) + .45) * centro(q) * (.45 + banda(q) * 1.6 + ola(fr) * 1.4) * esp * k;

  // ===== Las 24 animaciones =====
  const EF = [
    { // 1. Clásica
      cuadro() { apiladas(26, H * .16, H * .72, alturaBase, (i, fr) => { tapar(); trazo(u * .9, c(HUE + i * 2, 45 + vol * 20, 40 + fr * 30 + vol * 20, .3 + fr * .45 + vol * .2)); }); } },
    { // 2. Cordillera: perspectiva, varias cimas
      cuadro() {
        const N = 30, hor = H * .2;
        for (let i = 0; i < N; i++) {
          const d = i / (N - 1), y0 = hor + Math.pow(d, 1.7) * H * .72, am = (.35 + d * 1.4) * 14 * u * (1 + ola(d) * 1.2);
          x.beginPath(); x.moveTo(0, y0);
          for (let px = 0; px <= W; px += 4 * u) { const q = px / W, env = centro(q, 2.2) * .7 + centro(q - .22, 4) * .5 + centro(q + .25, 4) * .45; x.lineTo(px, y0 - Math.max(0, ruido(q, i) + .6) * env * am * (.5 + banda(q) * 1.3)); }
          x.lineTo(W, H); x.lineTo(0, H); x.closePath(); tapar(); trazo(u * (.5 + d * .8), c(HUE + d * 20, 45, 35 + d * 40 + vol * 10, .15 + d * .7));
        }
      } },
    { // 3. Pulso circular
      cuadro() {
        const N = 18, cx = W / 2, cy = H / 2, g = Bs[0] + Bs[1];
        for (let k = N - 1; k >= 0; k--) {
          const r0 = 20 * u + k * 10 * u * (1 + g * .08), fr = 1 - k / N, o = ola(fr);
          x.beginPath();
          for (let a = 0; a <= 360; a += 3) { const q = a / 360, rad = a * Math.PI / 180, r = r0 + Math.max(0, ruido(q, k) + .4) * (.4 + banda(Math.abs(q - .5)) * 1.4 + o) * 9 * u; a ? x.lineTo(cx + Math.cos(rad) * r, cy + Math.sin(rad) * r * .85) : x.moveTo(cx + r, cy); }
          x.closePath(); tapar(); trazo(u * .9, c(HUE + k * 3, 45, 38 + fr * 35 + g * 10, .25 + fr * .5));
        }
      } },
    { // 4. Cortina: las ondas en vertical
      cuadro() {
        const N = 34, izq = W * .12, esp = W * .76 / N;
        for (let i = 0; i < N; i++) {
          const x0 = izq + i * esp, fr = i / N;
          x.beginPath(); x.moveTo(x0, 0);
          for (let py = 0; py <= H; py += 4 * u) { const q = py / H; x.lineTo(x0 - Math.max(0, ruido(q, i) + .55) * centro(q, 2.8) * (.45 + banda(q) * 1.6 + ola(fr)) * esp * 3, py); }
          x.lineTo(x0 + W, H); x.lineTo(x0 + W, 0); x.closePath(); tapar(); trazo(u * .9, c(HUE + i * 2, 45, 42 + fr * 30 + vol * 15, .3 + fr * .45));
        }
      } },
    { // 5. Espejo: hacia arriba y hacia abajo, como un osciloscopio
      cuadro() {
        const N = 16, top = H * .2, esp = H * .6 / N; x.lineWidth = Math.max(1, u * .8);
        for (let i = 0; i < N; i++) {
          const y0 = top + i * esp + esp / 2, fr = i / N;
          for (const s of [-1, 1]) {
            x.beginPath();
            for (let px = 0; px <= W; px += 4 * u) { const q = px / W, h = Math.max(0, ruido(q, i) + .5) * centro(q, 2.6) * (.45 + banda(q) * 1.6 + ola(fr)) * esp * 1.3; px ? x.lineTo(px, y0 - s * h) : x.moveTo(px, y0); }
            x.strokeStyle = c(HUE + i * 3, 50, 50 + fr * 25, (.25 + fr * .4 + vol * .2) * (s < 0 ? 1 : .55)); x.stroke();
          }
        }
      } },
    { // 6. Puntos
      cuadro() { apiladas(24, H * .16, H * .72, alturaBase, (i, fr, y0, pts) => { tapar(); x.fillStyle = c(HUE + i * 2, 50, 55 + fr * 25, .4 + fr * .5); const r = Math.max(1, u * (.6 + fr * .7)); for (let k = 0; k < pts.length; k += 2) x.fillRect(pts[k][0] - r / 2, pts[k][1] - r / 2, r, r); }); } },
    { // 7. Cumbres encendidas
      cuadro() { apiladas(24, H * .16, H * .72, (q, i, fr, esp) => alturaBase(q, i, fr, esp, 3.4), (i, fr, y0, pts, esp) => { tapar(); const g = x.createLinearGradient(0, y0 - esp * 5, 0, y0); g.addColorStop(0, c(HUE + 30, 75, 66 + vol * 12, .95)); g.addColorStop(.5, c(HUE + 10, 55, 50, .55)); g.addColorStop(1, c(HUE, 35, 30, .18)); x.strokeStyle = g; x.lineWidth = Math.max(1, u * (.8 + fr * .5)); x.stroke(); }); } },
    { // 8. Gotas: caen gotas y sus ondas recorren las líneas (cada golpe, una gota)
      crear() { Z.gotas = []; },
      cuadro(dt) {
        if (Math.random() < dt * .3) Z.gotas.push({ q: Math.random() * .8 + .1, i: Math.floor(Math.random() * 24), e: 0, f: .8 });
        if (golpe) Z.gotas.push({ q: Math.random() * .6 + .2, i: 6 + Math.floor(Math.random() * 12), e: 0, f: 1.2 + vol });
        for (const g of Z.gotas) g.e += dt; Z.gotas = Z.gotas.filter(g => g.e < 3);
        const extra = (q, i, esp) => { let e = 0; for (const g of Z.gotas) { const d = Math.hypot((q - g.q) * W, (i - g.i) * esp); e += Math.exp(-Math.pow((d - g.e * 160 * u) / (22 * u), 2)) * Math.max(0, 1 - g.e / 3) * g.f; } return e; };
        apiladas(24, H * .16, H * .72, (q, i, fr, esp) => (Math.max(0, ruido(q, i) * .5 + .35) * centro(q, 2.2) * esp * 1.4 * (.6 + vol) + extra(q, i, esp) * esp * 1.8), (i, fr) => { tapar(); trazo(u * .9, c(HUE + 190 + i * 2, 40, 45 + fr * 30, .3 + fr * .5)); });
      } },
    { // 9. Papel: capas recortadas
      cuadro() { apiladas(14, H * .2, H * .72, (q, i, fr, esp) => Math.max(0, ruido(q, i) * .8 + .7) * (.35 + centro(q, 1.6) * .65) * (.5 + banda(q) * 1.3 + ola(fr)) * esp * 1.6, (i, fr) => { x.fillStyle = c(HUE + fr * 40, 32, 10 + fr * 16 + vol * 6, 1); x.fill(); trazo(u * .6, c(HUE + fr * 40, 40, 30 + fr * 20, .6)); }); } },
    { // 10. Espiral: una sola línea que gira; con cada verso, un pulso la recorre hacia afuera
      cuadro() {
        const cx = W / 2, cy = H / 2, vueltas = 9, paso = (Math.min(W, H) * .46) / (vueltas * Math.PI * 2);
        x.beginPath();
        for (let a = 0; a < vueltas * Math.PI * 2; a += .04) { const q = (a % (Math.PI * 2)) / (Math.PI * 2), k = Math.floor(a / (Math.PI * 2)), r = 8 * u + a * paso + Math.max(0, ruido(q, k) + .4) * (3 + banda(q) * 9 + ola(a / (vueltas * Math.PI * 2)) * 7) * u, ang = a + t * .15; const X2 = cx + Math.cos(ang) * r, Y2 = cy + Math.sin(ang) * r * .82; a ? x.lineTo(X2, Y2) : x.moveTo(X2, Y2); }
        trazo(u, c(HUE + 20, 50, 55 + vol * 20, .45 + vol * .3));
      } },
    { // 11. Neón
      cuadro() { apiladas(12, H * .22, H * .64, (q, i, fr, esp) => Math.max(0, ruido(q, i) + .55) * centro(q, 2.6) * (.45 + banda(q) * 1.6 + ola(fr)) * esp * 2.6, (i, fr) => { tapar(); trazo(u * 6, c(HUE + i * 6, 90, 60, .12 + fr * .1 + vol * .1)); trazo(u * 1.1, c(HUE + i * 6, 90, 72, .5 + fr * .4)); }); } },
    { // 12. Espectro: el historial del sonido se aleja hacia atrás
      crear() { Z.filas = []; Z.reloj = 0; },
      cuadro(dt) {

    { // 13. Curvas de nivel: un terreno dibujado con sus líneas de altura

      cuadro(dt) {

    { // 14. Cuerdas: vibran solas; con cada verso se pulsan todas, una tras otra (arpegio)
      crear() { Z.pulso = -10; },
      cuadro() {
        if (golpe) Z.pulso = t;

        }
      } },
    { // 15. Interferencia: dos fuentes de ondas; los golpes encienden una tercera
      crear() { Z.f3 = 0; },
      cuadro(dt) {
        if (golpe) Z.f3 = Math.min(1.6, Z.f3 + .8); Z.f3 = Math.max(0, Z.f3 - dt * .6);
        const N = 34, top = H * .1, esp = H * .8 / N, fuentes = [[W * (.3 + .08 * Math.sin(t * .2)), H * .5, 1], [W * (.7 + .08 * Math.cos(t * .17)), H * .5, 1], [W * .5, H * .3, Z.f3]], am = .5 + vol * 1.2;

        }
      } },
    { // 16. Dunas: arena ondulada; los golpes son ráfagas
      crear() { Z.racha = 0; },
      cuadro(dt) {
        if (golpe) Z.racha = Math.max(Z.racha, .6); Z.racha = Math.max(0, Z.racha - dt * .5);
        const N = 40, top = H * .12, esp = H * .8 / N;
        for (let i = 0; i < N; i++) {

          for (let px = 0; px <= W; px += 4 * u) { const q = px / W; x.lineTo(px, y0 - (Math.sin(q * 16 + i * .55 + t * .35) * .55 + Math.sin(q * 7 - i * .2 + t * .2) * .45 + 1) * esp * .7 * (.6 + banda(q) * 1.4 + r * 2.5)); }
          x.lineTo(W, y0 + H); x.lineTo(0, y0 + H); x.closePath(); tapar(); trazo(u * .8, c(HUE + 25 + fr * 10, 40, 35 + fr * 35, .25 + fr * .55));
        }
      } },
    { // 17. Corona: rayos alrededor del centro
      cuadro() {
        const cx = W / 2, cy = H / 2, N = 180, r0 = H * .2; x.lineWidth = Math.max(1, u * .8);
        for (let k = 0; k < N; k++) {
          const a = k / N * Math.PI * 2 + t * .05, q = k / N, l = (Math.max(0, ruido(q * 2 % 1, k % 7) + .6) * .35 + .1 + banda(q) * .8) * H * .24 * (1 + ola(.5) * .4);

    { // 19. Valle: dos cordilleras frente a frente, con la letra en medio
      cuadro() {
        const N = 12, esp = H * .32 / N;
        for (const lado of [-1, 1]) for (let i = 0; i < N; i++) {

          x.lineTo(W, lado < 0 ? -H : H * 2); x.lineTo(0, lado < 0 ? -H : H * 2); x.closePath(); tapar(); trazo(u * .9, c(HUE + i * 3 + (lado > 0 ? 30 : 0), 45, 40 + (1 - fr) * 30, .25 + (1 - fr) * .5));

      } },
    { // 20. Trigal: filas en perspectiva; el viento (y la música) son franjas de luz
      crear() { Z.racha = 0; },
      cuadro(dt) {
        if (golpe) Z.racha = Math.max(Z.racha, .7); Z.racha = Math.max(0, Z.racha - dt * .35);
        const viento = (q, d) => { const a = Math.sin(q * 7 - t * .9 + d * 5) * .5 + Math.sin(q * 13 + t * .4 - d * 9) * .25 + Math.sin(q * 3 - t * .5 + d * 2) * .25, r = Z.racha * Math.exp(-Math.pow((q - (t * .35 % 1.4 - .2)) * 4, 2)); return Math.max(0, Math.min(1, .4 + a * .45 + r * .9 + banda(q) * .35)); };

    { // 21. Osciloscopio: una sola línea que dibuja figuras; con cada verso se expande y se ilumina
      cuadro(dt) {
        const im = impulso(dt), cx = W / 2, cy = H / 2, R = H * .32 * (.6 + vol * .8) * (1 + im * .3), fb = 2 + Math.sin(t * .07) * .5, ph = t * .4;

      } },
    { // 22. Ecos: la onda deja copias que suben y se apagan; las de los golpes, más brillantes
      crear() { Z.ecos = []; Z.reloj = 0; },
      cuadro(dt) {
        const onda = () => { const f = []; for (let j = 0; j <= 120; j++) { const q = j / 120; f.push((banda(q) + Math.sin(q * 40 + t * 3) * .03) * Math.exp(-Math.pow((q - .5) * 2.4, 2))); } return f; };

    { // 24. Marea: líneas que cruzan como olas lentas

  function tamano() {

  function bucle(ahora) {
    requestAnimationFrame(bucle);

    const dt = Math.min(.1, (ahora - ultimo) / 1000); ultimo = ahora;
    if (innerWidth === 0 || innerHeight === 0) return;
    if (W !== Math.min(1920, Math.round(innerWidth * Math.min(window.devicePixelRatio || 1, 2)))) tamano();

  requestAnimationFrame(bucle);

  const hslRgb = txt => {
    const m = /hsl\(\s*([\d.]+)\s+([\d.]+)%\s+([\d.]+)%/.exec(txt || ''); if (!m) return null;

    cancion(m) {

    destello() { verso = true; },

})();

// Salir del karaoke: al tocar la pantalla aparece la ×, y se esconde sola a los 3 s.
// En el teléfono avisa a la app; en la PC cierra la ventana del karaoke. En la tele nadie toca la pantalla.
let ocultarSalir = 0;
function mostrarSalir() {
  const b = $('#salir'); b.hidden = false; b.classList.remove('oculto');
  clearTimeout(ocultarSalir); ocultarSalir = setTimeout(() => b.classList.add('oculto'), 3000);
}
addEventListener('pointerdown', e => { if (e.target.id !== 'salir') mostrarSalir(); });
addEventListener('mousemove', mostrarSalir);
$('#salir').onclick = () => { if (window.OidoKaraoke) window.OidoKaraoke.salir(); else window.close(); };

window.__karaoke = recibir;                                // tele: lo llama Android
window.addEventListener('message', e => recibir(e.data));  // teléfono: lo manda la app
</script>
