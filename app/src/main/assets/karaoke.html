<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Oído · Karaoke</title>
<!--
  Modo karaoke. La misma página se muestra:
  - en la tele, cuando hay una segunda pantalla (cable, dock, Miracast);
  - en el teléfono, al girarlo con la letra en pantalla completa.
  Recibe mensajes { tipo: 'cancion' | 'pos', ... } de la app.
-->
<style>
  :root {
    color-scheme: dark;
    --fondo: hsl(175 22% 7%); --linea: hsl(175 14% 19%); --texto: hsl(175 20% 92%);
    --suave: hsl(175 10% 58%); --acento: hsl(175 78% 62%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fondo); color: var(--texto); overflow: hidden;
    font: 16px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  }
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  /* En vivo: etiqueta en lugar de la barra de tiempo */
  .en-vivo { display: inline-flex; align-items: center; gap: .5em; font-size: 2.4vmin; letter-spacing: .12em; font-weight: 600; color: var(--acento, #fff); }
  .en-vivo::before { content: ''; width: .7em; height: .7em; border-radius: 50%; background: currentColor; animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .35; } }
  /* Salir: aparece al tocar la pantalla */
  #salir { position: fixed; top: 3vmin; right: 3vmin; z-index: 5; width: 9vmin; height: 9vmin; min-width: 44px; min-height: 44px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.45); color: #fff; font-size: 5vmin; line-height: 1; cursor: pointer;
    transition: opacity .3s; }
  #salir.oculto { opacity: 0; pointer-events: none; }
  /* Ocultar o mostrar la letra de esta canción: aparece junto a la × */
  #letra-k { position: fixed; top: 3vmin; right: 14vmin; z-index: 5; height: 9vmin; min-height: 44px; padding: 0 3vmin;
    border-radius: 99px; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.45); color: #fff; font-size: 2.6vmin; cursor: pointer; transition: opacity .3s; }
  #letra-k.oculto { opacity: 0; pointer-events: none; }
  /* Controles de la canción */
  #ctrl { position: fixed; inset: 0; z-index: 4; pointer-events: none; transition: opacity .3s;
    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.35)); }
  #ctrl.oculto { opacity: 0; }
  #ctrl.oculto * { pointer-events: none !important; }
  .ctrl-centro { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 7vmin; }
  .ctrl-centro button, .ctrl-barra input { pointer-events: auto; }
  .ctrl-centro button { width: 12vmin; height: 12vmin; min-width: 52px; min-height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
    background: rgba(0,0,0,.45); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ctrl-centro #k-play { width: 16vmin; height: 16vmin; min-width: 64px; min-height: 64px; background: var(--acento); color: #000; border: none; }
  .ctrl-centro svg { width: 45%; height: 45%; fill: currentColor; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .ctrl-barra { position: absolute; left: 8vw; right: 8vw; bottom: 5vmin; display: flex; align-items: center; gap: 2.5vmin;
    color: #fff; font-size: 2.6vmin; font-variant-numeric: tabular-nums; }
  .ctrl-barra input { flex: 1; accent-color: var(--acento); height: 6vmin; min-height: 32px; cursor: pointer; }
  body.ctrl-visible .bar { visibility: hidden; }          /* la barra fija se esconde: la reemplaza la que se arrastra */
  /* Aviso del doble toque: −10 s / +10 s */
  #salto { position: fixed; top: 50%; transform: translateY(-50%); z-index: 4; padding: 2vmin 4vmin; border-radius: 99px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 3.4vmin; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #salto.ver { opacity: 1; }
  #rollo .l { text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
  #k { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 4vh 5vw 5vh; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4vw; }
  #tit { font-size: 3.4vmin; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }
  #art { font-size: 2.6vmin; color: var(--suave); }
  .logo { display: flex; align-items: center; gap: 1vmin; color: var(--suave); font-size: 2.6vmin; flex: none; }
  .logo svg { width: 3.6vmin; height: 3.6vmin; }

  .vista { flex: 1; min-height: 0; display: none; }
  .vista.visible { display: flex; }

  /* Letra sincronizada: un rollo que sube suavemente; la línea actual queda al centro, grande */
  #lineas { position: relative; overflow: hidden; }
  #rollo { position: absolute; left: 0; right: 0; top: 0; text-align: center; will-change: transform;
           transition: transform .55s cubic-bezier(.22, .7, .25, 1); }
  #rollo.sin-animacion { transition: none; }
  #rollo .l { max-width: 70vw; margin: 0 auto; padding: 2.2vh 0; font-size: 5.2vmin; line-height: 1.25;
              color: var(--texto); opacity: .45; transform-origin: center;
              transition: opacity .4s ease, color .4s ease, transform .4s ease; }
  #rollo .l.pasada { opacity: .22; }
  #rollo .l.actual { color: var(--acento); opacity: 1; font-weight: 700; transform: scale(1.32); }
  /* Brillo: el verso nuevo entra con un resplandor que se apaga despacio */
  #rollo .l.actual.entra { animation: entra 1.4s ease-out; }
  @keyframes entra { 0% { text-shadow: 0 0 .45em var(--acento), 0 0 .12em var(--acento); } 100% { text-shadow: 0 1px 4px rgba(0, 0, 0, .6); } }

  /* Letra fija: texto completo que se desplaza con el avance de la canción */
  #fija { overflow: hidden; justify-content: center; }
  #fija-texto { white-space: pre-wrap; text-align: center; font-size: 4.6vmin; line-height: 1.5; padding: 20vh 0; }
  #fija-nota { position: absolute; top: 12vh; left: 0; right: 0; text-align: center; color: var(--suave); font-size: 2.4vmin; }

  /* Sin letra: título y logo en grande */
  #solo { flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 2vh; }
  #solo svg { width: 18vmin; height: 18vmin; }
  #solo-tit { font-size: 6vmin; font-weight: 700; max-width: 90vw; }
  #solo-art { font-size: 3.6vmin; color: var(--suave); }

  .bar { display: flex; align-items: center; gap: 2vw; font-size: 2.4vmin; color: var(--suave); font-variant-numeric: tabular-nums; }
  .trk { flex: 1; height: .7vmin; min-height: 3px; border-radius: 99px; background: var(--linea); overflow: hidden; }
  #prog { height: 100%; width: 0; background: var(--acento); transition: width .25s linear; }
  #ctrl[hidden], .ctrl-barra[hidden] { display: none; }
  /* Al final, para que siempre ganen: lo oculto se oculta */
  .en-vivo[hidden] { display: none; }
  body.vivo .bar { display: none; }
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>
<button id="salir" type="button" aria-label="Salir" hidden>×</button>
<button id="letra-k" type="button" hidden></button>
<!-- Controles: aparecen al tocar la pantalla y se esconden solos -->
<div id="ctrl" class="oculto" hidden>
  <div class="ctrl-centro">
    <button id="k-ant" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button>
    <button id="k-play" type="button" aria-label="Pausar"></button>
    <button id="k-sig" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button>
  </div>
  <div class="ctrl-barra" id="k-barra"><span id="k-pos">0:00</span><input type="range" id="k-seek" min="0" max="1000" value="0" aria-label="Posición"><span id="k-dur">0:00</span></div>
</div>
<div id="salto" aria-hidden="true"></div>
<div id="k">
  <div class="top">
    <div><div id="tit"></div><div id="art"></div></div>
    <div class="logo">
      <svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="42" cy="54" r="7.5" fill="currentColor" style="color:var(--acento)"/><g fill="none" stroke="var(--acento)" stroke-width="7" stroke-linecap="round"><path d="M54.4 41a18 18 0 0 1 0 26"/><path d="M64.2 31a32 32 0 0 1 0 46"/></g></svg>
      Oído
    </div>
  </div>

  <div id="lineas" class="vista"><div id="rollo"></div></div>

  <div id="fija" class="vista">
    <div id="fija-nota">Letra sin sincronizar</div>
    <div id="fija-texto"></div>
  </div>

  <div id="solo" class="vista visible">
    <svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="42" cy="54" r="7.5" fill="var(--acento)"/><g fill="none" stroke="var(--acento)" stroke-width="7" stroke-linecap="round"><path d="M54.4 41a18 18 0 0 1 0 26"/><path d="M64.2 31a32 32 0 0 1 0 46"/></g></svg>
    <div id="solo-tit">Oído</div>
    <div id="solo-art"></div>
  </div>

  <div class="bar"><span id="pos">0:00</span><div class="trk"><div id="prog"></div></div><span id="dur"></span></div>
  <div class="en-vivo" id="vivo" hidden>EN VIVO</div>
</div>
<script>
const $ = s => document.querySelector(s);
let cancion = null, pos = 0, dur = 0, actual = -2;

const fmt = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
};

function mostrar(id) {
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('visible', v.id === id));
}

function aplicarColores(tema) {
  if (tema) for (const [k, v] of Object.entries(tema)) document.documentElement.style.setProperty(k, v);
}

function pintar() {
  const c = cancion || {};
  aplicarColores(c.tema);
  $('#tit').textContent = c.titulo || '';
  $('#fija-nota').textContent = (c.textos && c.textos.fija) || 'Letra sin sincronizar';
  $('#vivo').textContent = (c.textos && c.textos.vivo) || 'EN VIVO';
  $('#vivo').hidden = !c.vivo;
  document.body.classList.toggle('vivo', !!c.vivo);
  $('#salir').setAttribute('aria-label', (c.textos && c.textos.salir) || 'Salir');
  $('#art').textContent = c.canal || '';
  $('#solo-tit').textContent = c.titulo || 'Oído';
  $('#solo-art').textContent = c.canal || '';
  const est = c.letra && c.letra.estado;
  if (est === 'sinc') { mostrar('lineas'); construirRollo(c.letra.lineas || []); }
  else if (est === 'fija') { mostrar('fija'); $('#fija-texto').textContent = c.letra.texto || ''; $('#fija').scrollTop = 0; }
  else mostrar(c.vivo ? 'ninguna' : 'solo');       // en vivo: pantalla limpia, solo la animación
  // Con letra (o en vivo) el nombre va en la esquina; sin letra, grande en el centro
  document.querySelector('.top').style.visibility = est || c.vivo ? 'visible' : 'hidden';
  actual = -2;
  mover();
}

function mover() {
  $('#pos').textContent = fmt(pos);
  $('#dur').textContent = dur ? fmt(dur) : '';
  $('#prog').style.width = dur ? Math.min(100, pos / dur * 100) + '%' : '0';
  const l = cancion && cancion.letra;
  if (!l) return;
  if (l.estado === 'fija') {
    const f = $('#fija');
    if (dur) f.scrollTo({ top: (f.scrollHeight - f.clientHeight) * Math.min(1, pos / dur), behavior: 'smooth' });
    return;
  }
  const ls = l.lineas || [];
  let i = -1;
  for (let k = 0; k < ls.length && ls[k].t <= pos + 200; k++) i = k; // 0,2 s de adelanto
  if (i === actual) return;
  const primera = actual === -2;
  actual = i;
  const els = $('#rollo').children;
  for (let k = 0; k < els.length; k++) {
    els[k].classList.toggle('actual', k === i);
    els[k].classList.toggle('pasada', k < i);
  }
  centrar(!primera);
  const el = els[i];                                // verso nuevo: entra con un brillo suave
  if (el && !primera) { el.classList.remove('entra'); void el.offsetWidth; el.classList.add('entra'); }
}

// Arma todas las líneas una debajo de otra
function construirRollo(ls) {
  const r = $('#rollo');
  r.innerHTML = '';
  for (const l of ls) {
    const d = document.createElement('div');
    d.className = 'l';
    d.textContent = l.texto || '♪';
    r.appendChild(d);
  }
}

// Desliza el rollo para que la línea actual (o la primera, en la intro) quede al centro
function centrar(animado) {
  const r = $('#rollo');
  const ref = r.children[Math.max(0, actual)];
  if (!ref) return;
  const alto = $('#lineas').clientHeight;
  const y = alto / 2 - (ref.offsetTop + ref.offsetHeight / 2);
  r.classList.toggle('sin-animacion', !animado);
  r.style.transform = `translateY(${y}px)`;
  if (!animado) requestAnimationFrame(() => r.classList.remove('sin-animacion'));
}
window.addEventListener('resize', () => centrar(false));

function recibir(m) {
  if (!m || typeof m !== 'object') return;
  if (m.tipo === 'cancion') { cancion = m; pintar(); Fondo.cancion(m); }
  // Solo cambió el color (tema dinámico o elegido): se repinta sin reiniciar la letra
  else if (m.tipo === 'tema') { aplicarColores(m.tema); Fondo.colores(m.tema); if (cancion) cancion.tema = m.tema; }
  else if (m.tipo === 'pos') { pos = m.pos || 0; dur = m.dur || 0; posLlego = performance.now(); if (m.sonando != null) sonandoK = !!m.sonando; mover(); pintarControles(); }
}
// ---------- Fondo animado: 44 animaciones de líneas, tranquilas ----------
// Se mueven solas; con letra sincronizada, cada verso nuevo dispara la reacción de la animación (Fondo.destello()).
const Fondo = (() => {
  const cv = $('#fondo'), x = cv.getContext('2d');
  let W = 0, H = 0, u = 1, HUE = 175, FON = '#0e1615', ef = -1, clave = null, t = 0, ultimo = 0, Z = {};
  const c = (h, s, l, a = 1) => `hsla(${((h % 360) + 360) % 360} ${s}% ${l}% / ${a})`;

  // ===== Ritmo propio + versos =====
  // Las líneas respiran solas, suave y continuo. Con letra sincronizada, cada verso nuevo
  // manda una ola y un latido (y cada animación hace su propia reacción: gota, ráfaga, eco…).
  const Bs = new Float32Array(16);
  const G = { golpe: 0, cuerpo: 0, voz: 0, brillo: 0 };
  let vol = .35, nivel = .35, olas = [], golpe = false, patada = 0, caja = 0, verso = false;
  function sonido(dt) {
    G.golpe = .26 + .1 * Math.sin(t * .5);
    G.cuerpo = .24 + .08 * Math.sin(t * .31 + 1);
    G.voz = .3 + .1 * Math.sin(t * .37 + 2);
    G.brillo = .2 + .06 * Math.sin(t * .43 + 3);
    nivel = .38 + .06 * Math.sin(t * .2);
    golpe = verso; verso = false;
    if (golpe) { olas.push(0); patada = 1; }
    patada = Math.max(0, patada - dt * 2.5);           // el latido del verso se apaga en ~0,4 s
    for (let k = 0; k < 16; k++) Bs[k] = k <= 2 ? Math.min(1, G.golpe + patada * .6) : k <= 5 ? G.cuerpo : k <= 11 ? G.voz : G.brillo;
    vol = Math.min(1, nivel + patada * .25);
    olas = olas.map(o => o + dt * .9).filter(o => o < 1.6);
  }
  const banda = q => { const d = Math.abs(q - .5) * 2; return Math.min(1.3, (G.golpe * .45 + patada * .85) * (1 - d) + G.voz * Math.exp(-Math.pow((d - .35) * 3, 2)) * .7 + (G.brillo * .25 + caja * .45) * d + nivel * .12); };
  const ola = fr => { let s = 0; for (const o of olas) s += Math.exp(-Math.pow((fr - (1 - o)) * 7, 2)); return s * 1.5; };   // ola del bombo, exagerada
  const ruido = (q, i) => Math.sin(q * 23 + i * 1.7 + t * .9) * .35 + Math.sin(q * 51 - i * .9 + t * 1.4) * .2 + Math.sin(q * 9 + i * .4 - t * .5) * .45;
  const centro = (q, a = 3.2) => Math.exp(-Math.pow((q - .5) * a, 2));
  const trazo = (w, col) => { x.strokeStyle = col; x.lineWidth = Math.max(1, w); x.stroke(); };
  const tapar = () => { x.fillStyle = FON; x.fill(); };
  const luzCima = (y0, alto, h = HUE) => { const g = x.createLinearGradient(0, y0 - alto, 0, y0); g.addColorStop(0, c(h + 30, 70, 68, .95)); g.addColorStop(.55, c(h + 10, 50, 48, .5)); g.addColorStop(1, c(h, 30, 28, .15)); return g; };
  // Impulso del verso para las animaciones que no usan olas (sube al instante y baja en ~1,2 s)
  const impulso = dt => { if (golpe) Z.p = 1; Z.p = Math.max(0, (Z.p || 0) - dt * .8); return Z.p * Z.p * (3 - 2 * Z.p); };
  // Líneas apiladas que se tapan unas a otras (las de adelante tapan a las de atrás)
  function apiladas(N, top, alto, altura, estilo) {
    const esp = alto / N;
    for (let i = 0; i < N; i++) {
      const y0 = top + i * esp, fr = i / N, pts = [];
      x.beginPath(); x.moveTo(0, y0);
      for (let px = 0; px <= W; px += 4 * u) { const y = y0 - altura(px / W, i, fr, esp); x.lineTo(px, y); pts.push([px, y]); }
      x.lineTo(W, y0 + H); x.lineTo(0, y0 + H); x.closePath();
      estilo(i, fr, y0, pts, esp);
    }
  }
  const alturaBase = (q, i, fr, esp, k = 3.2) => Math.max(0, ruido(q, i) + .45) * centro(q) * (.45 + banda(q) * 1.6 + ola(fr) * 1.4) * esp * k;

  // ===== Las 24 animaciones =====
  // ===== Piezas compartidas por Viaje, Ciudad, Planeta, Túnel, Raíces, Sauce e islas =====
  const azar = (a, b) => a + Math.random() * (b - a);
  const ruidoL = (v, s) => Math.sin(v * 1.7 + s) * .5 + Math.sin(v * 3.9 + s * 2.3) * .3 + Math.sin(v * 8.3 + s * .7) * .2;
  // Árbol con ángulos relativos (para que se meza: cada rama suma el movimiento de la anterior)
  function arbolL(n, largo, gr, t0) {
    const nodo = { rel: azar(-.15, .15), largo, gr, t0, d: largo / (80 * u), hijos: [] };
    if (n > 0 && largo > 8 * u) { const k = Math.random() < .35 ? 3 : 2; for (let i = 0; i < k; i++) { const h = arbolL(n - 1, largo * azar(.62, .8), gr * .7, t0 + largo / (80 * u)); h.rel = (i - (k - 1) / 2) * azar(.35, .6) + azar(-.12, .12); nodo.hijos.push(h); } }
    return nodo;
  }
  function dibujarArbolL(n, x0, y0, ang, prof, fase, apaga, viento) {
    const a = ang + n.rel + viento(prof, x0), x1 = x0 + Math.cos(a) * n.largo, y1 = y0 + Math.sin(a) * n.largo, p = Math.max(0, Math.min(1, (fase - n.t0) / n.d));
    if (!p) return;
    x.beginPath(); x.moveTo(x0, y0); x.lineTo(x0 + (x1 - x0) * p, y0 + (y1 - y0) * p);
    const alt = 1 - y1 / H; trazo(n.gr, c(HUE + 20 + alt * 30, 55, 35 + alt * 40, (.35 + alt * .5) * apaga));
    if (p >= 1) for (const h of n.hijos) dibujarArbolL(h, x1, y1, a, prof + 1, fase, apaga, viento);
  }
  // Islas: contorno de una curva de nivel
  const contornoL = (cx, cy, base, a, sem, mov) => { const r = base * (1 + .18 * Math.sin(3 * a + sem) + .1 * Math.sin(5 * a - mov + sem * 2) + .06 * Math.sin(9 * a + mov * .7)); return [cx + Math.cos(a) * r * 1.5, cy + Math.sin(a) * r]; };
  function anilloL(cx, cy, base, sem, mov, ancho, col) { x.beginPath(); for (let a = 0; a <= Math.PI * 2 + .01; a += .03) { const p = contornoL(cx, cy, base, a, sem, mov); a ? x.lineTo(...p) : x.moveTo(...p); } x.closePath(); trazo(ancho, col); }
  // Planeta
  const rotarL = (X, Y, Zz, incl) => [X, Y * Math.cos(incl) - Zz * Math.sin(incl), Y * Math.sin(incl) + Zz * Math.cos(incl)];
  function haloL(cx, cy, Rr) { const g = x.createRadialGradient(cx, cy, Rr * .95, cx, cy, Rr * 1.25); g.addColorStop(0, c(HUE + 30, 70, 55, .18)); g.addColorStop(1, c(HUE + 30, 70, 55, 0)); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  function paralelosL(cx, cy, Rr, incl, rot, n = 24, montes = 0) {
    x.lineWidth = Math.max(1, u * .9);
    for (let k = 1; k < n; k++) {
      const lat = -Math.PI / 2 + k / n * Math.PI; let prev = null;
      for (let a = 0; a <= Math.PI * 2 + .01; a += .04) {
        const lon = a + rot, mont = 1 + montes * Math.max(0, Math.sin(lon * 3 + lat * 4) * Math.cos(lon * 1.3 - lat * 2)), r = Rr * mont;

            for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) { const v = e.v[(r * cols + k) % 12]; if (Math.sin(t * .15 + v * 40 + r) > .55 - v * .3) x.fillRect(x1 + 3 * u + k * 7 * u, y + 4 * u + r * 9 * u, 2.2 * u, 3 * u); }
          }
          x.globalAlpha = 1;
        }
      } },
    { // 42. Rascacielos: mirar hacia arriba entre torres de luz
      cuadro() {
        const cx = W * .5, cy = -H * .4, N = 9;
        for (let k = 0; k < N; k++) {
          const ang = (k / (N - 1) - .5) * 2.2 + Math.sin(t * .05) * .05, anch = .07 + .03 * Math.sin(k * 1.7);
          for (const e of [ang - anch, ang + anch]) {
            x.beginPath(); x.moveTo(cx + Math.sin(e) * W * 1.3, H * 1.05); x.lineTo(cx + Math.sin(e) * W * .08, cy + H * .55);
            const g = x.createLinearGradient(0, H, 0, 0); g.addColorStop(0, c(HUE, 35, 30, .3)); g.addColorStop(1, c(HUE + 30, 70, 70, .85));
            x.strokeStyle = g; x.lineWidth = Math.max(1, u * 1.1); x.stroke();
          }
          for (let p = 1; p < 9; p++) {
            const q = Math.pow(p / 9, 1.6), y = H * 1.05 - (H * 1.05 - (cy + H * .55)) * q;
            x.beginPath(); x.moveTo(cx + Math.sin(ang - anch) * W * (1.3 - 1.22 * q), y); x.lineTo(cx + Math.sin(ang + anch) * W * (1.3 - 1.22 * q), y);
            trazo(u * .5, c(HUE + 20, 45, 45, .15 + .25 * Math.max(0, Math.sin(t * .3 + k + p))));
          }
        }
      } },
    { // 43. Velero: un velero cruza despacio sobre el oleaje
      cuadro() {
        const hor = H * .58; oleajeL(hor, 22, 8);
        const vx = ((t * .012) % 1.3 - .15) * W, vy = hor + 2 * u + Math.sin(t * 1.1) * 1.5 * u;
        x.beginPath(); x.moveTo(vx - 24 * u, vy); x.quadraticCurveTo(vx, vy + 8 * u, vx + 26 * u, vy); trazo(u * 1.3, c(HUE + 20, 40, 55, .85));
        x.beginPath(); x.moveTo(vx, vy); x.lineTo(vx, vy - 62 * u); x.lineTo(vx + 24 * u, vy - 6 * u); x.closePath(); tapar(); trazo(u * 1.2, c(HUE + 30, 70, 68, .9));
        x.beginPath(); x.moveTo(vx - 2 * u, vy - 56 * u); x.lineTo(vx - 22 * u, vy - 8 * u); x.lineTo(vx - 2 * u, vy - 8 * u); trazo(u, c(HUE + 30, 60, 58, .7));
        for (let i = 0; i < 5; i++) { x.beginPath(); x.moveTo(vx - 10 * u, vy + (i * 3 + 3) * u); x.lineTo(vx + 12 * u, vy + (i * 3 + 3) * u); trazo(u * .6, c(HUE + 30, 60, 55, .25 - i * .04)); }
      } },
    { // 44. Luna en el mar: el oleaje y el camino de luz de la luna
      cuadro() {
        const hor = H * .45, mx = W * .62, my = H * .18;
        const g = x.createRadialGradient(mx, my, 0, mx, my, 60 * u); g.addColorStop(0, c(HUE + 40, 60, 85, .35)); g.addColorStop(1, c(HUE + 40, 60, 85, 0)); x.fillStyle = g; x.fillRect(0, 0, W, hor);
        x.beginPath(); x.arc(mx, my, 14 * u, 0, Math.PI * 2); trazo(u * 1.4, c(HUE + 40, 70, 85, .9));
        for (let i = 0; i < 26; i++) {
          const d = i / 25, y0 = hor + Math.pow(d, 1.5) * (H - hor), am = (1 + d * 7) * u;
          x.beginPath(); for (let px = 0; px <= W; px += 5 * u) { const q = px / W, y = y0 + Math.sin(q * (9 + i * .4) - t * (.6 + d * .4) + i * 1.3) * am; px ? x.lineTo(px, y) : x.moveTo(px, y); }
          const gg = x.createLinearGradient(0, 0, W, 0), an = .05 + d * .2, base = c(HUE + 200, 40, 30, .2 + d * .3);
          gg.addColorStop(0, base); gg.addColorStop(Math.max(0, mx / W - an), base); gg.addColorStop(mx / W, c(HUE + 40, 80, 82, .85)); gg.addColorStop(Math.min(1, mx / W + an), base); gg.addColorStop(1, base);
          x.strokeStyle = gg; x.lineWidth = Math.max(1, u * (.4 + d * .9)); x.stroke();
        }
      } },
  ];

  function tamano() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = Math.min(1920, Math.round(innerWidth * dpr));
    W = cv.width = w; H = cv.height = Math.round(w * innerHeight / Math.max(1, innerWidth)); u = H / 360;
  }
  // Máximo 30 cuadros por segundo; si el karaoke no está a la vista, no dibuja
  function bucle(ahora) {
    requestAnimationFrame(bucle);
    if (!x || document.hidden || ahora - ultimo < 33) return;
    const dt = Math.min(.1, (ahora - ultimo) / 1000); ultimo = ahora;
    if (innerWidth === 0 || innerHeight === 0) return;
    if (W !== Math.min(1920, Math.round(innerWidth * Math.min(window.devicePixelRatio || 1, 2)))) tamano();
    t += dt; sonido(dt);
    if (ef < 0) return;
    x.globalAlpha = 1; x.fillStyle = FON; x.fillRect(0, 0, W, H);
    EF[ef].cuadro(dt);
  }
  addEventListener('resize', tamano);
  requestAnimationFrame(bucle);

  const hslRgb = txt => {
    const m = /hsl\(\s*([\d.]+)\s+([\d.]+)%\s+([\d.]+)%/.exec(txt || ''); if (!m) return null;
    const h = +m[1] / 360, s = +m[2] / 100, l = +m[3] / 100;
    const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
    return [f(0), f(8), f(4)];
  };
  return {
    colores(tema) {
      if (!tema) return;
      const m = /hsl\(\s*([\d.]+)/.exec(tema['--acento'] || ''); if (m) HUE = +m[1];
      const f = hslRgb(tema['--fondo']); if (f) FON = `rgb(${f[0]},${f[1]},${f[2]})`;
    },
    cancion(m) {
      this.colores(m.tema);
      const k = (m.titulo || '') + '|' + (m.canal || '');
      if (k === clave) return;          // misma canción (llegó la letra o cambió el tema): misma animación
      clave = k;
      // Sorteo con pesos: Cumbres sale más seguido (sin repetir la misma dos veces seguidas)
      const pesos = EF.map(e => e.peso || 1), total = pesos.reduce((a, b) => a + b, 0);
      let n; do { let r = Math.random() * total; n = 0; while ((r -= pesos[n]) > 0) n++; } while (n === ef && EF.length > 1);
      ef = n; Z = {}; olas = []; patada = 0;
      if (EF[ef].crear) EF[ef].crear();
    },
    // 16 bandas del sonido que está sonando (0..1)
    // Verso nuevo de la letra sincronizada: cada animación hace su reacción
    destello() { verso = true; },
    get estilo() { return ef; },
    total: () => EF.length,
  };
})();

// Salir del karaoke: al tocar la pantalla aparece la ×, y se esconde sola a los 3 s.
// En el teléfono avisa a la app; en la PC cierra la ventana del karaoke. En la tele nadie toca la pantalla.
let ocultarSalir = 0, posLlego = 0, sonandoK = true, arrastrando = false, ultToque = { t: 0, lado: 0 }, ocultarSalto = 0;
const comandoKaraoke = c => { if (window.OidoKaraoke && window.OidoKaraoke.comando) window.OidoKaraoke.comando(c); else if (window.oidoKaraoke) window.oidoKaraoke.comando(c); };
const puedeOrdenar = () => !!((window.OidoKaraoke && window.OidoKaraoke.comando) || window.oidoKaraoke);
const ICONO_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
const ICONO_PAUSA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>';
const posAhora = () => pos + (sonandoK ? Math.min(1500, performance.now() - posLlego) : 0);
function pintarControles() {
  const c = cancion || {};
  $('#k-play').innerHTML = sonandoK ? ICONO_PAUSA : ICONO_PLAY;
  $('#k-play').setAttribute('aria-label', sonandoK ? 'Pausar' : 'Reproducir');
  $('#k-barra').hidden = !!c.vivo || !dur;                     // en vivo no hay a dónde saltar
  if (!arrastrando && dur) { $('#k-seek').value = Math.round(pos / dur * 1000); $('#k-pos').textContent = fmt(pos); $('#k-dur').textContent = fmt(dur); }
}
function esconder() {
  if (arrastrando) return;
  $('#salir').classList.add('oculto'); $('#letra-k').classList.add('oculto'); $('#ctrl').classList.add('oculto');
  document.body.classList.remove('ctrl-visible');
}
function mostrarControles() {
  const b = $('#salir'), lk = $('#letra-k'), c = cancion || {};
  b.hidden = false; b.classList.remove('oculto');
  // Ocultar/mostrar la letra: solo si la canción tiene letra y se puede avisar a la app
  const tiene = !!(c.letra || c.letraOculta) && puedeOrdenar();
  lk.hidden = !tiene; lk.classList.remove('oculto');
  if (tiene) lk.textContent = c.letraOculta ? ((c.textos && c.textos.mostrar) || 'Mostrar letra') : ((c.textos && c.textos.ocultar) || 'Ocultar letra');
  // Controles de la canción (no en la tele: ahí se controla desde el teléfono)
  if (puedeOrdenar()) { $('#ctrl').hidden = false; $('#ctrl').classList.remove('oculto'); document.body.classList.add('ctrl-visible'); pintarControles(); }
  clearTimeout(ocultarSalir); ocultarSalir = setTimeout(esconder, 3000);
}
const mostrarSalir = mostrarControles;
const ir = ms => { if (!dur) return; ms = Math.max(0, Math.min(dur - 500, ms)); pos = ms; posLlego = performance.now(); comandoKaraoke('ir:' + Math.round(ms)); pintarControles(); };
function avisoSalto(txt, lado) {
  const el = $('#salto'); el.textContent = txt;
  el.style.left = lado < 0 ? '12vw' : ''; el.style.right = lado > 0 ? '12vw' : '';
  el.classList.add('ver'); clearTimeout(ocultarSalto); ocultarSalto = setTimeout(() => el.classList.remove('ver'), 700);
}
$('#k-play').onclick = () => { comandoKaraoke('alternar'); sonandoK = !sonandoK; pintarControles(); mostrarControles(); };
$('#k-sig').onclick = () => { comandoKaraoke('siguiente'); mostrarControles(); };
$('#k-ant').onclick = () => { comandoKaraoke('anterior'); mostrarControles(); };
$('#k-seek').addEventListener('input', () => { arrastrando = true; $('#k-pos').textContent = fmt(+$('#k-seek').value / 1000 * dur); clearTimeout(ocultarSalir); });
$('#k-seek').addEventListener('change', () => { arrastrando = false; ir(+$('#k-seek').value / 1000 * dur); mostrarControles(); });
$('#letra-k').onclick = () => { const c = cancion || {}; comandoKaraoke(c.letraOculta ? 'mostrar-letra' : 'ocultar-letra'); mostrarControles(); };
// Tocar la pantalla muestra los controles; doble toque a un lado salta 10 s
addEventListener('pointerdown', e => {
  if (e.target && e.target.closest && e.target.closest('button, input')) return;
  const ahora = performance.now(), x = e.clientX / innerWidth, lado = x < .33 ? -1 : x > .67 ? 1 : 0;
  const c = cancion || {};
  if (lado && ultToque.lado === lado && ahora - ultToque.t < 320 && puedeOrdenar() && !c.vivo && dur) {
    ir(posAhora() + lado * 10000); avisoSalto(lado < 0 ? '−10 s' : '+10 s', lado); ultToque = { t: 0, lado: 0 };
  } else ultToque = { t: ahora, lado };
  mostrarControles();
});
addEventListener('mousemove', mostrarControles);
// Teclado (PC): espacio pausa, ← → saltan 5 s, N siguiente, P anterior, Esc cierra
addEventListener('keydown', e => {
  const enCampo = e.target && e.target.closest && e.target.closest('input');
  if (!puedeOrdenar() || enCampo) { if (e.key !== 'Escape') return; }
  const c = cancion || {};
  if (e.key === ' ') { e.preventDefault(); $('#k-play').onclick(); }
  else if (e.key === 'ArrowLeft' && !c.vivo) { e.preventDefault(); ir(posAhora() - 5000); avisoSalto('−5 s', -1); mostrarControles(); }
  else if (e.key === 'ArrowRight' && !c.vivo) { e.preventDefault(); ir(posAhora() + 5000); avisoSalto('+5 s', 1); mostrarControles(); }
  else if (e.key === 'n' || e.key === 'N') $('#k-sig').onclick();
  else if (e.key === 'p' || e.key === 'P') $('#k-ant').onclick();
  else if (e.key === 'Escape') $('#salir').onclick();
});
$('#salir').onclick = () => { if (window.OidoKaraoke) window.OidoKaraoke.salir(); else window.close(); };

window.__karaoke = recibir;                                // tele: lo llama Android
window.addEventListener('message', e => recibir(e.data));  // teléfono: lo manda la app
</script>
